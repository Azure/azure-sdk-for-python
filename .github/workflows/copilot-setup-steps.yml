name: Copilot Setup Steps

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Create and activate virtual environment
        run: |
          python -m venv .venv
          source .venv/bin/activate
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> "$GITHUB_ENV"
          echo "$(pwd)/.venv/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r eng/ci_tools.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Pre-install tsp-client (TypeSpec regeneration tooling)
        # Installs tsp-client here, while the setup job still has full network access, so that
        # later agent-initiated `npx`/`npm exec` calls against this directory (e.g. `tsp-client
        # generate`) don't need to resolve registry.npmjs.org from inside the agent's firewalled
        # session.
        run: npm ci --prefix eng/common/tsp-client

      - name: Pre-install TypeSpec Python emitter's pinned black version
        # `tsp-client update` (any package, not just azure-ai-projects) shells out to the
        # TypeSpec Python emitter (`@azure-tools/typespec-python`) to format generated code. The
        # emitter creates its own isolated venv and pip-installs a specific pinned `black`
        # version from its own dev_requirements.txt
        # (https://github.com/Azure/typespec-azure/blob/main/packages/typespec-python/dev_requirements.txt),
        # which is versioned with whichever emitter release gets resolved for a given TypeSpec
        # commit -- so the pin isn't visible from this repository's own manifests and can drift
        # as the emitter is updated upstream. A plain "pip install" here would only warm pip's
        # HTTP cache, which pip does not consult as a fallback when the package index itself is
        # unreachable (verified: pip still fails after retrying the index, even with a matching
        # wheel already cached). Instead, download the currently-known pinned wheel and its
        # dependencies into a fixed directory, and point PIP_FIND_LINKS at it for the rest of the
        # job, including the firewalled agent session: pip treats find-links entries as an extra
        # local source alongside the index, so an exact-version match is installable from there
        # even when the index connection fails outright (verified against a fully broken index
        # connection). Bump the version below if a future regeneration fails while fetching a
        # different pinned black version.
        run: |
          mkdir -p "$HOME/.cache/pip-find-links"
          python -m pip download "black==26.3.1" -d "$HOME/.cache/pip-find-links"
          echo "PIP_FIND_LINKS=$HOME/.cache/pip-find-links" >> "$GITHUB_ENV"

      - name: Pre-install azure-ai-projects dev dependencies
        # Scoped to sessions whose branch name identifies them as azure-ai-projects work (e.g.
        # "copilot/azure-ai-projects-regenerate-<commit>", the actual naming GitHub's issue
        # assignment uses for this package's regeneration workflow), so unrelated cloud agent
        # sessions in this repo don't pay for a package-specific install. A plain branch-name
        # check is used instead of git ancestry because actions/checkout's default shallow clone
        # (fetch-depth: 1) does not reliably support merge-base ancestry checks.
        run: |
          BRANCH="$(git rev-parse --abbrev-ref HEAD)"
          if [[ "${BRANCH,,}" == *azure-ai-projects* ]]; then
            echo "On branch '$BRANCH' (matches azure-ai-projects); installing its dev dependencies."
            # dev_requirements.txt contains bare local paths (e.g. "../../core/azure-core") that
            # pip resolves against the current working directory, not the requirements file's own
            # directory. Run it with cwd set to the package directory, in a subshell so the rest
            # of this job keeps the repository root as its working directory.
            (cd sdk/ai/azure-ai-projects && \
              python -m pip install -r dev_requirements.txt && \
              python -m pip install -e .)
          else
            echo "On branch '$BRANCH' (no azure-ai-projects match); skipping its dev dependency pre-install."
          fi

      - name: Install azsdk mcp server
        shell: pwsh
        run: |
          ./eng/common/mcp/azure-sdk-mcp.ps1 -InstallDirectory $HOME/bin

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.8
        with:
          version: v0.80.9
