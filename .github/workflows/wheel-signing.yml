name: Test Wheel Signing

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "eng/scripts/wheel_signing/**"
      - ".github/workflows/wheel-signing.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.13

      - name: Configure package indexes
        uses: ./.github/actions/configure-package-indexes

      - name: Install test dependencies
        run: python -m pip install pytest packaging
        shell: bash

      - name: Run wheel-signing tests
        run: pytest eng/scripts/wheel_signing/tests
        shell: bash