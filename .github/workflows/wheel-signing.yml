name: Test Wheel Signing

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "eng/scripts/wheel_signing/**"
      - ".github/workflows/wheel-signing.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13

      - name: Configure package indexes
        uses: ./.github/actions/configure-package-indexes

      - name: Install test dependencies
        run: python -m pip install pytest packaging
        shell: bash

      - name: Run wheel-signing tests
        run: pytest eng/scripts/wheel_signing/tests
        shell: bash