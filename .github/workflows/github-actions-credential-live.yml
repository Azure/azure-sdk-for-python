name: GitHub Actions credential live test

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: Tenant ID of the Entra test application
        required: true
        type: string
      client_id:
        description: Client ID of the Entra test application
        required: true
        type: string
      scope:
        description: Token scope to request
        required: true
        default: https://management.azure.com/.default
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AZURE_TENANT_ID: ${{ inputs.tenant_id }}
      AZURE_CLIENT_ID: ${{ inputs.client_id }}
      TEST_SCOPE: ${{ inputs.scope }}

    steps:
      - name: Check test identity configuration
        shell: bash
        run: |
          if [[ -z "$AZURE_TENANT_ID" || -z "$AZURE_CLIENT_ID" ]]; then
            echo "::error::Provide the tenant ID and client ID of an Entra test application."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Azure Identity from source
        run: python -m pip install ./sdk/identity/azure-identity aiohttp

      - name: Acquire an access token (sync)
        run: |
          python - <<'PY'
          import os
          from azure.identity import GitHubActionsCredential

          with GitHubActionsCredential() as credential:
              token = credential.get_token(os.environ["TEST_SCOPE"])

          if not token.token:
              raise RuntimeError("GitHubActionsCredential did not return an access token.")

          print(f"Successfully acquired an access token expiring at {token.expires_on}.")
          PY

      - name: Acquire an access token (async)
        run: |
          python - <<'PY'
          import asyncio
          import os
          from azure.identity.aio import GitHubActionsCredential

          async def main():
              async with GitHubActionsCredential() as credential:
                  return await credential.get_token(os.environ["TEST_SCOPE"])

          token = asyncio.run(main())

          if not token.token:
              raise RuntimeError("Async GitHubActionsCredential did not return an access token.")

          print(f"Successfully acquired an async access token expiring at {token.expires_on}.")
          PY
