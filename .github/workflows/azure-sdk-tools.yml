name: Test Azure SDK Tools

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "eng/tools/azure-sdk-tools/**"
      - ".github/workflows/azure-sdk-tools.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Configure package indexes
        uses: ./.github/actions/configure-package-indexes

      - name: Install azure-sdk-tools
        run: |
          python -m pip install -e 'eng/tools/azure-sdk-tools[ghtools,conda]'
          python -m pip freeze
        shell: bash

      - name: Run tests
        run: |
          pytest ./tests
        shell: bash
        working-directory: eng/tools/azure-sdk-tools

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Configure package indexes
        uses: ./.github/actions/configure-package-indexes

      - name: Install azure-sdk-tools
        run: |
          python -m pip install -e 'eng/tools/azure-sdk-tools[ghtools,conda]'
          python -m pip install black==24.4.0
          python -m pip freeze
        shell: bash

      - name: Run black
        run: |
          black --check --config eng/black-pyproject.toml eng/tools/azure-sdk-tools --exclude 'templates'
        shell: bash

  verify-azpysdk-checks:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: 3.13

      - name: Configure package indexes
        uses: ./.github/actions/configure-package-indexes

      - name: Az CLI login
        uses: azure/login@v3
        with:
          client-id: e4cb9fd5-0875-4ca1-bc43-56196f5dfb8f
          tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
          allow-no-subscriptions: true

      - name: Configure feed auth token for uv/pip upstream pull-through
        run: |
          AZURE_DEVOPS_TOKEN=$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken \
            -o tsv)
          echo "::add-mask::$AZURE_DEVOPS_TOKEN"
          echo "UV_INDEX_AZURE_SDK_USERNAME=x" >> "$GITHUB_ENV"
          echo "UV_INDEX_AZURE_SDK_PASSWORD=$AZURE_DEVOPS_TOKEN" >> "$GITHUB_ENV"
          echo "PIP_INDEX_URL=https://x:${AZURE_DEVOPS_TOKEN}@pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-python/pypi/simple/" >> "$GITHUB_ENV"
        shell: bash

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
        shell: bash

      - name: Install azure-sdk-tools on in global uv, discover azpysdk checks
        run: |
          uv pip install --system -e 'eng/tools/azure-sdk-tools[ghtools,conda,systemperf]'

          # Discover available azpysdk commands from the {command1,command2,...} line in help output
          CHECKS=$(azpysdk -h 2>&1 | \
            grep -oP '\{[^}]+\}' | \
            tail -1 | \
            tr -d '{}' | \
            tr ',' '\n' | \
            grep -v '^next-' | \
            grep -v '^changelog$' | \
            sort | \
            paste -sd,)

          if [ -z "$CHECKS" ]; then
            echo "No azpysdk check modules discovered from azpysdk -h" >&2
            exit 1
          fi
          echo "Discovered azpysdk checks: $CHECKS"
          echo "AZPYSDK_CHECKS=$CHECKS" >> "$GITHUB_ENV"
        shell: bash

      - name: Run all discovered checks against azure-template using uv as package manager
        run: |
          sdk_build azure-template -d "$(pwd)/wheels" --build_id 20250101.1
          python eng/scripts/dispatch_checks.py --checks "$AZPYSDK_CHECKS" --wheel_dir "$(pwd)/wheels" azure-template
        shell: bash
        env:
          AZPYSDK_PIP_IMPL: "uv"

      - name: Install azure-sdk-tools on global pip env
        run: |
          python -m pip install -e 'eng/tools/azure-sdk-tools[ghtools,conda]'
        shell: bash

      - name: Run all discovered checks against azure-template using pip as package manager
        run: |
          python eng/scripts/dispatch_checks.py --checks "$AZPYSDK_CHECKS" --wheel_dir "$(pwd)/wheels" azure-template
        shell: bash
        env:
          AZPYSDK_PIP_IMPL: "pip"
