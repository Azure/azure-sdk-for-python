name: Pipeline Analysis Branch Cleanup

on:
  workflow_run:
    workflows: [Agentic Maintenance]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete completed auto-fix branches
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prefixes = ["pipeline-fix/", "copilot-pipeline-fix/"];
            const branchPattern = /^(?:pipeline-fix|copilot-pipeline-fix)\/pr-\d+-[0-9a-f]{40}\/run-\d+\/.+$/;
            const orphanMinAgeMs = 24 * 60 * 60 * 1000;
            const refs = [];
            for (const prefix of prefixes) {
              refs.push(...await github.paginate(github.rest.git.listMatchingRefs, {
                ...context.repo,
                ref: `heads/${prefix}`,
                per_page: 100,
              }));
            }

            let deleted = 0;
            for (const ref of refs) {
              const branch = ref.ref.replace(/^refs\/heads\//, "");
              if (!branchPattern.test(branch)) {
                core.info(`Keeping ${branch}: branch name does not match the generated auto-fix pattern.`);
                continue;
              }
              const pulls = await github.paginate(github.rest.pulls.list, {
                ...context.repo,
                state: "all",
                head: `${context.repo.owner}:${branch}`,
                per_page: 100,
              });
              if (pulls.some(pull => pull.state === "open")) {
                core.info(`Keeping ${branch}: a correlated PR is open.`);
                continue;
              }
              let reason = "all correlated PRs are closed";
              if (!pulls.length) {
                const { data: commit } = await github.rest.git.getCommit({
                  ...context.repo,
                  commit_sha: ref.object.sha,
                });
                const committedAt = Date.parse(commit.committer?.date);
                if (!Number.isFinite(committedAt) || Date.now() - committedAt < orphanMinAgeMs) {
                  core.info(`Keeping ${branch}: no correlated PR exists and the branch is less than 24 hours old.`);
                  continue;
                }
                reason = "no correlated PR exists and the branch is at least 24 hours old";
              }
              await github.rest.git.deleteRef({
                ...context.repo,
                ref: `heads/${branch}`,
              });
              deleted += 1;
              core.info(`Deleted ${branch}: ${reason}.`);
            }

            await core.summary
              .addHeading("Pipeline auto-fix branch cleanup")
              .addRaw(`Deleted ${deleted} branch(es). Inspected ${refs.length} branch(es).`)
              .write();