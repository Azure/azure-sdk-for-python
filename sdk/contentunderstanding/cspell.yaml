# cspell configuration for this service. Words are case-insensitive and
# kept sorted alphabetically. The import of the central config is required.
import:
  - ../../.vscode/cspell.json
words:
  - Agentic
  - chartjs
  - llmstats
  - redef
  - UPCA
  - UPCE
ignorePaths:
  - sdk/contentunderstanding/azure-ai-contentunderstanding/samples/sample_files/training_samples/*.json
