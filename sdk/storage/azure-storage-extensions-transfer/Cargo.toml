[package]
name = "azure-storage-extensions-transfer"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.25", features = ["extension-module"] }
azure_storage_blob = "1.1.0-beta.1"
azure_core = { version = "1", features = ["xml"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
once_cell = "1"
