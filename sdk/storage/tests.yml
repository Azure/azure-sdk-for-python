trigger: none

parameters:
  - name: Services
    type: object
    default:
      - azure-storage-blob
      - azure-storage-file-datalake
      - azure-storage-file-share
      - azure-storage-queue

extends:
    template: /eng/pipelines/templates/stages/archetype-sdk-tests.yml
    parameters:
      Location: 'westus2'
      # All 5 service stages run in parallel, and with no parallel limits the tests may get throttled.
      MaxParallel: 2
      ServiceDirectory: storage
      InstallMsRustToolchain: true
      MsRustWorkingDirectory: $(Build.SourcesDirectory)/sdk/storage/azure-storage-extensionstransfer
      MsRustToolchainFeed: https://pkgs.dev.azure.com/azure-sdk/_packaging/azure-sdk-for-rust-org-test/nuget/v3/index.json
      InjectedPackages: $(InjectedPackages)
      Packages: ${{ parameters.Services }}
      MatrixReplace:
        - TestSamples=.*/true
      EnvVars:
        AZURE_SKIP_LIVE_RECORDING: 'True'
        AZURE_TEST_RUN_LIVE: 'true'
        AZURE_SUBSCRIPTION_ID: $(STORAGE_SUBSCRIPTION_ID)
