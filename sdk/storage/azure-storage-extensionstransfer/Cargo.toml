[package]
name = "azure-storage-extensions-transfer"
# Keep in sync with azure/storage/extensions/transfer/_version.py for Azure SDK tooling.
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29" }
azure_storage_blob = "1.1.0"
azure_core = { version = "1", features = ["xml"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
once_cell = "1"
futures = "0.3"
