[package]
name        = "azure_cosmos_rust"
version     = "0.1.0"
description = "PyO3 binding that exposes the azure_data_cosmos_driver crate to the azure-cosmos Python SDK"
authors.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish = false

# `cdylib` is the load-bearing line: tells Cargo to produce a C-compatible
# dynamic library that Python can load via the import machinery. Maturin
# then renames the resulting .dll/.so/.dylib to _rust.{pyd,so}
# and drops it into azure/cosmos/ next to the .py files.
[lib]
name       = "azure_cosmos_rust"
crate-type = ["cdylib"]

[dependencies]
# PyO3 makes Rust functions Python-callable.
#
# `extension-module` : build a Python extension (no link to libpython).
# `abi3-py39`        : target the stable ABI from Python 3.9 onward, so
#                      one wheel per platform works for every Python 3.9+.
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }

# The driver crate, pulled in as a path dependency from a sibling clone of
# the azure-sdk-for-rust repo. Both repos are expected to live side-by-side
# under the same parent directory (e.g. ~/source/repos/). If you keep them
# elsewhere, edit this path or change it to a `git = ...` dependency.
azure_data_cosmos_driver = { path = "../../../../../azure-sdk-for-rust/sdk/cosmos/azure_data_cosmos_driver" }

# Tokio runtime. Lives here, not in the driver, because the binding is
# what bridges Python's sync call into Rust's async world.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Non-poisoning RwLock for the per-(endpoint, credential) driver cache. Unlike
# std::sync::RwLock, a panic while a guard is held (e.g. a CosmosDriver::Drop that
# panics) does NOT poison the lock, so one failed teardown can't turn every later
# cache access into a process-killing panic. It also has no LockResult to unwrap,
# which removes the `.unwrap()` panic sites at every lock acquisition.
parking_lot = "0.12"

# Bridges a Rust future to a Python asyncio awaitable, so the async path can hand
# the event loop something to `await` instead of parking one worker thread per
# in-flight call. Version tracks pyo3 (0.22). Used by the async entry points in
# `documents.rs` / `wire.rs`.
pyo3-async-runtimes = { version = "0.22", features = ["tokio-runtime"] }

# `async-trait` is required to implement the driver/azure_core `TokenCredential`
# trait (an `async fn` trait method) for the Python-backed credential bridge.
async-trait = { workspace = true }

# Parsing the account endpoint when constructing AccountReference.
url = { workspace = true }

# Parsing the partition-key header and reading the body id. `serde` (derive)
# backs the one-field struct that reads only `id` from a write body instead of
# parsing the whole document.
serde = { workspace = true }
serde_json = { workspace = true }

# Surfaced at the binding boundary when forwarding driver errors.
azure_core = { workspace = true }
