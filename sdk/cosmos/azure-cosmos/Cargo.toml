# Cargo workspace root for the azure-cosmos Python SDK.
#
# One member crate lives under this root:
#   - azure_cosmos_rust/   the PyO3 binding compiled into _rust.pyd
#
# The driver crate (azure_data_cosmos_driver) is not in this repo. Cargo
# downloads it from GitHub at the commit pinned below. `maturin develop`
# (run from this directory) compiles the binding plus the driver into one
# cdylib that gets dropped into azure/cosmos/ next to the .py files.

[workspace]
members = [
    "azure_cosmos_rust",
]
resolver = "2"

# -----------------------------------------------------------------------------
# Workspace-level metadata inherited by the binding crate via `.workspace = true`.
# -----------------------------------------------------------------------------
[workspace.package]
authors      = ["Microsoft <azpysdkhelp@microsoft.com>"]
edition      = "2021"
license      = "MIT"
repository   = "https://github.com/Azure/azure-sdk-for-python"
# Same version as the rust-toolchain.toml channel: the only compiler CI tests.
rust-version = "1.97"

[workspace.lints.rust]
# The binding has no `unsafe` code. Block it so memory-safety bugs can't be added later.
unsafe_code = "forbid"

# Same clippy policy as the driver repo (azure-sdk-for-rust\Cargo.toml).
[workspace.lints.clippy]
large_futures = "deny"
style = { level = "allow", priority = -1 }
uninlined_format_args = "allow"

# -----------------------------------------------------------------------------
# Workspace-level dependencies. Used by the binding crate (azure_cosmos_rust)
# via `.workspace = true`.
#
# IMPORTANT: `azure_core` MUST resolve to the same crate instance the external
# driver uses, otherwise azure_core-native types (e.g. `TokenCredential`,
# `AccessToken`, `azure_core::Error`) are different Rust types. The binding
# inherits this published crates.io version so it can unify with the driver.
# The binding does not need azure_identity from the driver's own dev-tests.
# -----------------------------------------------------------------------------
[workspace.dependencies]
# --- azure-sdk-for-rust crates ---
# azure_core aligned with the driver's published version so the two unify.
azure_core     = "1.1.0"
# Pinned to one commit of Azure/azure-sdk-for-rust so CI, which does not check
# out that repo, builds the same driver. To build against a local driver
# checkout instead, see docs/build_and_release.md section 7.
azure_data_cosmos_driver = { git = "https://github.com/Azure/azure-sdk-for-rust", rev = "36c6f191ffe45ef44e5ef4efa26c59f0d71c3300" }

# --- crates.io deps the binding uses ---
# List only crates the binding declares. Cargo ignores entries no member
# inherits. The binding adds the features it needs.
async-trait         = "0.1"
getrandom           = "0.4"
parking_lot         = "0.12"
pyo3                = "0.22"
pyo3-async-runtimes = "0.22"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
sha2                = "0.10"
tokio               = "1"
url                 = "2"
