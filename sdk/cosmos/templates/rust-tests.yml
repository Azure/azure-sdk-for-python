# cspell:ignore msrust

parameters:
  - name: ToolchainFeed
    type: string

steps:
  # Supplemental checks run once, not in every emulator/dependency variation.
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      $results = '$(Build.ArtifactStagingDirectory)/llm-artifacts/cosmos-rust'
      New-Item -ItemType Directory -Force $results | Out-Null
      Write-Host '##vso[task.setvariable variable=uploadLlmArtifacts]true'
      Push-Location sdk/cosmos/azure-cosmos
      try {
        python -m pip install -r dev_requirements.txt
      } finally {
        Pop-Location
      }
      $wheels = @(Get-ChildItem '$(Build.ArtifactStagingDirectory)' -Recurse -Filter 'azure_cosmos-*-win_amd64.whl')
      if ($wheels.Count -ne 1) {
        throw "Expected exactly one built Cosmos Windows x64 wheel; found $($wheels.Count)."
      }
      python -m pip install --no-deps --force-reinstall $wheels[0].FullName
    displayName: Prepare supplemental tests against the built Rust wheel
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['PythonVersion'], '3.13'), eq(variables['ChecksOverride'], 'whl,sdist'))
  - template: /eng/pipelines/templates/steps/install-msrust-toolchain.yml
    parameters:
      ToolchainFeed: ${{ parameters.ToolchainFeed }}
      WorkingDirectory: $(Build.SourcesDirectory)/sdk/cosmos/azure-cosmos
      Condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['PythonVersion'], '3.13'), eq(variables['ChecksOverride'], 'whl,sdist'))
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $env:PYO3_PYTHON = (Get-Command python).Source
      python -I sdk/cosmos/azure-cosmos/scripts/run_rust_ci.py native `
        --results '$(Build.ArtifactStagingDirectory)/llm-artifacts/cosmos-rust/native'
      exit $LASTEXITCODE
    displayName: Run required Cargo workspace tests
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['PythonVersion'], '3.13'), eq(variables['ChecksOverride'], 'whl,sdist'))
  - pwsh: |
      python -I sdk/cosmos/azure-cosmos/scripts/run_rust_ci.py offline `
        --require-installed-wheel `
        --results '$(Build.ArtifactStagingDirectory)/llm-artifacts/cosmos-rust/offline'
      exit $LASTEXITCODE
    displayName: Run required offline Python tests against the built Rust wheel
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['PythonVersion'], '3.13'), eq(variables['ChecksOverride'], 'whl,sdist'))
    env:
      COSMOS_BACKEND: core-python
      APPLICATIONINSIGHTS_CONNECTION_STRING: ''
      COSMOSDBCONNECTIONSTRING: ''
  - task: PublishTestResults@2
    displayName: Publish required offline Python results
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['PythonVersion'], '3.13'), eq(variables['ChecksOverride'], 'whl,sdist'))
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: $(Build.ArtifactStagingDirectory)/llm-artifacts/cosmos-rust/offline/pytest.xml
      testRunTitle: Cosmos Rust offline Python
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
