# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.
trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
      - restapi*
  paths:
    include:
      - sdk/dataai/

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - restapi*
  paths:
    include:
      - sdk/dataai/

extends:
  template: ../../eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: dataai
    TestProxy: false
    VerifyAutorest: false
    Artifacts:
      - name: azure-data-ai
        safeName: azuredataai