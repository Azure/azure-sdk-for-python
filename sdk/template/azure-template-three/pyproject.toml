[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "azure-template-three"
version = "1.0.0b1"
description = "Microsoft Azure Template Package (Rust) Client Library for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Microsoft Corporation", email = "azuresdkengsysadmins@microsoft.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
"Bug Reports" = "https://github.com/Azure/azure-sdk-for-python/issues"
repository = "https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/template/azure-template-three"

[tool.maturin]
locked = true
python-source = "."
module-name = "azure.template.three._rust"
include = [
    { path = "rust-toolchain.toml", format = "sdist" },
    { path = "scripts/*.sh", format = "sdist" },
    { path = "tests/*.py", format = "sdist" },
    { path = "LICENSE", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
]
exclude = [
    "**/__pycache__/**",
    "**/*.py[co]",
    "azure/template/three/_rust.*.so",
    "azure/template/three/_rust.*.pyd",
]

# The fixture validates native wheels. Source-installing jobs do not yet provision Microsoft Rust.
[tool.azure-sdk-build]
mypy = false
pyright = false
type_check_samples = false
verifytypes = false
pylint = false
sphinx = false
verifysdist = false
verifywhl = false
sdist = false
breaking = false
suppressed_skip_warnings = ["*"]

[tool.azure-sdk-conda]
in_bundle = false

[tool.cibuildwheel]
build = ["cp310-*"]
skip = ["*-musllinux*"]
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { PATH = "$HOME/.msrustup/multiplexers/bin:$PATH" }

[tool.cibuildwheel.windows]
archs = ["AMD64", "ARM64"]

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
environment-pass = [
    "PIP_INDEX_URL",
    "MSRUSTUP_ACCESS_TOKEN",
    "MSRUSTUP_FEED_URL",
    "CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_INDEX",
    "CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_TOKEN",
    "CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_CREDENTIAL_PROVIDER",
]
environment = { MSRUSTUP_HOME = "/msrustup", CARGO_HOME = "/cargo", PATH = "/msrustup/multiplexers/bin:$PATH", CARGO_NET_GIT_FETCH_WITH_CLI = "true" }
before-all = "dnf install -y jq && mkdir -p $MSRUSTUP_HOME/bootstrap && cd $MSRUSTUP_HOME/bootstrap && sh /project/scripts/install-msrustup.sh && cd /project && $MSRUSTUP_HOME/bootstrap/msrustup toolchain install && sh /project/scripts/configure-cargo-feed.sh"

[[tool.cibuildwheel.overrides]]
select = "*-win_arm64"
environment = { CARGO_BUILD_TARGET = "aarch64-pc-windows-msvc", PYO3_CROSS_LIB_DIR = "$PYTHON_ARM64_LIB_DIR" }
