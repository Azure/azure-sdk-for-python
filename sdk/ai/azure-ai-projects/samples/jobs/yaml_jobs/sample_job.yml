$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: sample-command-job-from-yaml
command: "echo hello from yaml job"
environment_image_reference: "mcr.microsoft.com/azureml/curated/acpt-pytorch-2.2-cuda12.1:48"
compute: "<JOB_COMPUTE_ID>"
resources:
  instance_count: 1
# The key ("output") is the mount name referenced in the command.
# "asset_name" is the name the output is registered under, and is required.
outputs:
  output:
    type: uri_folder
    mode: ReadWriteMount
    asset_name: sample-yaml-job-output
# Groups related runs together. If omitted, the service uses "Default".
experiment_name: my-experiment
tags:
  sample: "true"
