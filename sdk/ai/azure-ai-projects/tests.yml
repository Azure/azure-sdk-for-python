trigger: none
pr: none

parameters:
  - name: selectionKind
    displayName: 'Query type (test-id example: *test_agent_tools_samples*[*mcp*project_connection*])'
    type: string
    default: sample-path
    values:
      - sample-path
      - test-id
  - name: selection
    displayName: 'Pattern (path example: samples/agents/tools/*project_connection*.py; use ; for OR)'
    type: string
    default: 'samples/agents/tools/sample_agent_mcp_with_project_connection.py;samples/agents/tools/sample_agent_mcp_with_project_connection_async.py'
  - name: testQueueCount
    displayName: 'Maximum parallel billable RG workers (selection is divided round-robin, not repeated)'
    type: number
    default: 4
    values:
      - 1
      - 2
      - 3
      - 4
  - name: identityResourceGroup
    displayName: 'Resource group with the shared identities (e.g. rg-azsdk-identities-westus3-102826_164519)'
    type: string
  - name: modelName
    displayName: 'Sample model (validation uses the existing project from an environment variable)'
    type: string
    default: gpt-5.2
  - name: modelVersion
    displayName: 'Sample model version; use auto to resolve the regional default'
    type: string
    default: '2025-12-11'
  - name: modelSku
    displayName: 'Sample model deployment SKU'
    type: string
    default: GlobalStandard
    values:
      - GlobalStandard
      - Standard
  - name: modelCapacity
    displayName: 'Sample model capacity units (quota checked before provisioning)'
    type: number
    default: 10

variables:
  - group: Foundry SDK Env Vars and Secrets
  - name: packageRoot
    value: $(Build.SourcesDirectory)/sdk/ai/azure-ai-projects
  # Connection configuration belongs here, not in the Run pipeline form.
  - name: azureServiceConnection
    value: azure-sdk-tests
  - name: PYTHON_DOTENV_DISABLED
    value: 'true'
  - name: PYTEST_ADDOPTS
    value: ''

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: Plan
        displayName: 'Select samples and generate deployment plan (no Azure changes)'
        jobs:
          - job: Plan
            timeoutInMinutes: 45
            pool:
              name: azsdk-pool
              image: ubuntu-24.04
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/sample-plan
                  artifactName: sample-plan
                  sbomEnabled: false
            steps:
              - checkout: self
              - template: /eng/pipelines/templates/steps/use-python-version.yml
                parameters:
                  versionSpec: '3.12'
              - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
                parameters:
                  EnableTwineAuth: false
                  EnableUvAuth: false
              - pwsh: |
                  python -m pip install --disable-pip-version-check -r dev_requirements.txt -e .
                  if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
                workingDirectory: $(packageRoot)
                displayName: 'Install SDK source and sample harness dependencies'
              - pwsh: |
                  $outputDirectory = '$(Build.ArtifactStagingDirectory)/sample-plan'
                  $manifest = Join-Path $outputDirectory 'selected-tests.json'
                  python tests/samples/ci/select_samples.py --selection-kind $env:SELECTION_KIND --selection $env:SAMPLE_SELECTION --queue-count $env:SAMPLE_QUEUE_COUNT --output $manifest
                  if ($LASTEXITCODE -ne 0) { throw 'No valid sample selection; no resources were provisioned.' }
                  $matrix = Get-Content -LiteralPath (Join-Path $outputDirectory 'queue-matrix.json') -Raw | ConvertFrom-Json -AsHashtable
                  $runnable = [ordered]@{}
                  foreach ($queueName in @($matrix.Keys | Sort-Object)) {
                    & ./tests/samples/ci/New-SampleDeploymentPlan.ps1 -SelectionManifest (Join-Path $outputDirectory "$queueName/selected-tests.json") `
                      -OutputDirectory (Join-Path $outputDirectory $queueName) -QueueName $queueName `
                      -IdentityResourceGroup $env:SAMPLE_IDENTITY_RESOURCE_GROUP -ModelName $env:SAMPLE_MODEL -ModelVersion $env:SAMPLE_MODEL_VERSION `
                      -ModelSku $env:SAMPLE_MODEL_SKU -ModelCapacity ([int] $env:SAMPLE_MODEL_CAPACITY)
                    # A queue whose samples were all rejected has no plan and gets no billable worker.
                    if (Test-Path -LiteralPath (Join-Path $outputDirectory "$queueName/deployment-plan.json")) {
                      $runnable[$queueName] = @{
                        QueueName = $queueName
                        Pool = 'azsdk-pool'
                        OSVmImage = 'ubuntu-24.04'
                        PythonVersion = '3.12'
                        CoverageArg = '--disablecov'
                        TestSamples = 'false'
                      }
                    }
                  }
                  $rejected = @(Get-ChildItem -LiteralPath $outputDirectory -Filter 'rejected-tests.json' -Recurse -File |
                    ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json } | ForEach-Object { $_ })
                  foreach ($item in $rejected) {
                    Write-Host "##vso[task.logissue type=error]Sample test rejected during planning (unsupported environment: $($item.unsupported -join ', ')): $($item.node_id)"
                  }
                  if ($runnable.Count -eq 0) { throw 'No selected sample test can run; no resources were provisioned.' }
                  if ($rejected.Count -gt 0) { Write-Host '##vso[task.complete result=SucceededWithIssues;]Some selected samples were rejected; the rest continue.' }
                  Write-Host "##vso[task.setvariable variable=RejectedTestCount;isOutput=true]$($rejected.Count)"
                  $matrixJson = $runnable | ConvertTo-Json -Compress
                  Write-Host "##vso[task.setvariable variable=WorkerMatrix;isOutput=true]$matrixJson"
                name: Plan
                workingDirectory: $(packageRoot)
                displayName: 'Show selected sample paths, exact pytest IDs, and a fresh deployment plan'
                env:
                  AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                  AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                  SELECTION_KIND: ${{ parameters.selectionKind }}
                  SAMPLE_SELECTION: ${{ parameters.selection }}
                  SAMPLE_IDENTITY_RESOURCE_GROUP: ${{ parameters.identityResourceGroup }}
                  SAMPLE_MODEL: ${{ parameters.modelName }}
                  SAMPLE_MODEL_VERSION: ${{ parameters.modelVersion }}
                  SAMPLE_MODEL_SKU: ${{ parameters.modelSku }}
                  SAMPLE_MODEL_CAPACITY: ${{ parameters.modelCapacity }}
                  SAMPLE_QUEUE_COUNT: ${{ parameters.testQueueCount }}

      - stage: RunSamples
        displayName: 'Provision billable resources -> shared Python live tests -> run-owned cleanup'
        dependsOn: Plan
        condition: succeeded()
        jobs:
          - job: AdmitTestQueues
            displayName: 'Check shared identities and aggregate capacity without creating resources'
            timeoutInMinutes: 20
            pool:
              name: azsdk-pool
              image: ubuntu-24.04
              os: linux
            templateContext:
              outputs:
                - output: pipelineArtifact
                  targetPath: $(Build.ArtifactStagingDirectory)/resolved-sample-plan
                  artifactName: resolved-sample-plan
                  sbomEnabled: false
            steps:
              - checkout: self
              - task: DownloadPipelineArtifact@2
                inputs:
                  artifactName: sample-plan
                  targetPath: $(Pipeline.Workspace)/sample-plan
              - task: AzureCLI@2
                displayName: 'Verify shared MI grants, no leftover RGs and batch quota'
                inputs:
                  azureSubscription: ${{ variables.azureServiceConnection }}
                  scriptType: pscore
                  scriptLocation: inlineScript
                  inlineScript: |
                    & '$(packageRoot)/tests/samples/ci/Invoke-SampleProvisioning.ps1' `
                      -BatchPlanDirectory '$(Pipeline.Workspace)/sample-plan' `
                      -ResolvedPlanDirectory '$(Build.ArtifactStagingDirectory)/resolved-sample-plan'
                env:
                  AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                  AZURE_TENANT_ID: $(AZURE_TENANT_ID)
          - template: /eng/pipelines/templates/jobs/live.tests.yml
            parameters:
              ServiceDirectory: ai
              BuildTargetingString: azure-ai-projects
              Matrix: stageDependencies.Plan.Plan.outputs['Plan.WorkerMatrix']
              MaxParallel: 4
              DependsOn: AdmitTestQueues
              TestTimeoutInMinutes: 180
              CheckEnv: samples
              OSName: linux
              UseFederatedAuth: true
              DisableAzureResourceCreation: true
              CloudConfig:
                Cloud: Public
                ServiceConnection: ${{ variables.azureServiceConnection }}
              EnvVars:
                PYTHONPATH: $(Build.SourcesDirectory)/sdk/ai/azure-ai-projects/tests/samples/ci
                AZURE_AI_PROJECTS_LIVE_TEST_STATE: $(Pipeline.Workspace)/sample-results/$(QueueName)/deployment-state.json
                AZURE_TEST_RUN_LIVE: 'true'
                AZURE_SKIP_LIVE_RECORDING: 'true'
                PYTHON_DOTENV_DISABLED: 'true'
                PYTEST_ADDOPTS: ''
                AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                LLM_VALIDATION_PROJECT_ENDPOINT: $(LLM_VALIDATION_PROJECT_ENDPOINT)
                SAMPLE_QUEUE_NAME: $(QueueName)
              PreSteps:
                - task: DownloadPipelineArtifact@2
                  displayName: 'Download this run''s admitted queue plans'
                  inputs:
                    artifactName: resolved-sample-plan
                    targetPath: $(Pipeline.Workspace)/sample-plan
                - template: /eng/pipelines/templates/steps/use-python-version.yml
                  parameters:
                    versionSpec: '3.12'
                - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
                  parameters:
                    EnableTwineAuth: false
                    EnableUvAuth: false
                - pwsh: |
                    New-Item -ItemType Directory -Path '$(Pipeline.Workspace)/sample-results/$(QueueName)' -Force | Out-Null
                    python -m pip install --disable-pip-version-check -r dev_requirements.txt -e .
                    if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed.' }
                  workingDirectory: $(packageRoot)
                  displayName: 'Prepare Python for provisioning and project readiness checks'
                - task: AzureCLI@2
                  displayName: 'Validate this queue and external output-validation project before provisioning'
                  inputs:
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      . '$(packageRoot)/tests/samples/ci/shared/SampleCiHelpers.ps1'
                      $planPath = '$(Pipeline.Workspace)/sample-plan/$(QueueName)/deployment-plan.json'
                      $samplePlan = Get-Content -LiteralPath $planPath -Raw | ConvertFrom-Json -AsHashtable
                      $null = Set-SampleSubscriptionContext -Plan $samplePlan
                      python '$(packageRoot)/tests/samples/ci/run_samples.py' --check-validation-config
                      if ($LASTEXITCODE -ne 0) { throw 'The existing validation-project environment variable is missing or invalid; no resources were provisioned.' }
                  env:
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    LLM_VALIDATION_PROJECT_ENDPOINT: $(LLM_VALIDATION_PROJECT_ENDPOINT)
                    SAMPLE_QUEUE_NAME: $(QueueName)
                - task: AzureCLI@2
                  displayName: 'Provision this queue using the package Foundry Bicep bundle'
                  inputs:
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      & '$(packageRoot)/tests/samples/ci/Invoke-SampleProvisioning.ps1' `
                        -PlanPath '$(Pipeline.Workspace)/sample-plan/$(QueueName)/deployment-plan.json' `
                        -StatePath '$(Pipeline.Workspace)/sample-results/$(QueueName)/deployment-state.json' `
                        -QueueName $env:SAMPLE_QUEUE_NAME -ConfirmProvisioning
                  env:
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    MCP_GITHUB_PAT: $(MCP_GITHUB_PAT)
                    PROJ_CONN_OPEN_API_KEY: $(PROJ_CONN_OPEN_API_KEY)
                    SAMPLE_QUEUE_NAME: $(QueueName)
                - task: AzureCLI@2
                  displayName: 'Wait for this queue''s Foundry project to accept requests'
                  inputs:
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      . '$(packageRoot)/tests/samples/ci/shared/SampleCiHelpers.ps1'
                      $state = Get-Content -LiteralPath '$(Pipeline.Workspace)/sample-results/$(QueueName)/deployment-state.json' -Raw | ConvertFrom-Json -AsHashtable
                      $null = Set-SampleSubscriptionContext -Plan $state.plan
                      python '$(packageRoot)/tests/samples/ci/live_test_job.py' `
                        --state '$(Pipeline.Workspace)/sample-results/$(QueueName)/deployment-state.json' --check-ready
                      if ($LASTEXITCODE -ne 0) { throw 'The deployed Foundry project is not ready for the selected tests.' }
                  env:
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    AZURE_TEST_RUN_LIVE: 'true'
                    AZURE_SKIP_LIVE_RECORDING: 'true'
                    LLM_VALIDATION_PROJECT_ENDPOINT: $(LLM_VALIDATION_PROJECT_ENDPOINT)
                    SAMPLE_QUEUE_NAME: $(QueueName)
              PostSteps:
                - task: AzureCLI@2
                  displayName: 'Always clean up this queue''s run-owned resources'
                  condition: always()
                  inputs:
                    azureSubscription: ${{ variables.azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      & '$(packageRoot)/tests/samples/ci/shared/Remove-SampleResources.ps1' `
                        -StatePath '$(Pipeline.Workspace)/sample-results/$(QueueName)/deployment-state.json' `
                        -QueueName $env:SAMPLE_QUEUE_NAME -ConfirmCleanup
                  env:
                    AZURE_SUBSCRIPTION_ID: $(AZURE_SUBSCRIPTION_ID)
                    AZURE_TENANT_ID: $(AZURE_TENANT_ID)
                    SAMPLE_QUEUE_NAME: $(QueueName)
                - task: 1ES.PublishPipelineArtifact@1
                  displayName: 'Publish this queue''s deployment state and diagnostics'
                  condition: always()
                  inputs:
                    targetPath: $(Pipeline.Workspace)/sample-results/$(QueueName)
                    artifactName: sample-results-$(QueueName)-$(System.JobAttempt)
                    sbomEnabled: false
      - stage: ReportRejectedSamples
        displayName: 'Fail the run for samples rejected during planning'
        dependsOn:
          - Plan
          - RunSamples
        condition: succeededOrFailed()
        jobs:
          - job: ReportRejectedSamples
            displayName: 'Report rejected samples after queue tests complete'
            condition: and(succeededOrFailed(), gt(variables['rejectedCount'], 0))
            timeoutInMinutes: 5
            variables:
              rejectedCount: $[ stageDependencies.Plan.Plan.outputs['Plan.RejectedTestCount'] ]
            pool:
              name: azsdk-pool
              image: ubuntu-24.04
              os: linux
            steps:
              - checkout: none
              - pwsh: |
                  throw "$env:REJECTED_COUNT selected sample test(s) were rejected during planning for unsupported environment variables; see the Plan stage errors."
                displayName: 'Fail for samples that could not be provisioned'
                env:
                  REJECTED_COUNT: $(rejectedCount)
