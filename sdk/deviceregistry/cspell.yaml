# cspell configuration for this service. Words are case-insensitive and
# kept sorted alphabetically. The import of the central config is required.
import:
  - ../../.vscode/cspell.json

overrides:
  - filename: sdk/deviceregistry/azure-iot-deviceregistrysoftwareupdate/_metadata.json
    words:
      - sudeviceregistry
  - filename: sdk/deviceregistry/azure-iot-deviceregistrysoftwareupdate/azure/iot/deviceregistrysoftwareupdate/_utils/model_base.py
    words:
      - deser
