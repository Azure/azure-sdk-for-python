# cspell configuration for this service. Words are case-insensitive and
# kept sorted alphabetically. The import of the central config is required.
import:
  - ../../.vscode/cspell.json
words:
  - asyncgw
  - ctxt
  - deserializers
  - Dtmf
  - FNNHHJT
  - gettz
  - mros
  - Nify
  - Njgw
  - nypg
  - orgid
  - PBOF
  - PSTN
  - Retriable
  - ssml
  - tzutc
  - unassigning
  - unassignment
  - unflattened
  - Unhold
  - unmuted
  - wday
  - XVCJ
  - Zwiz
