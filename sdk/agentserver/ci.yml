# NOTE: Please refer to https://aka.ms/azsdk/engsys/ci-yaml before editing this file.

parameters:
  - name: PublishA2AAlpha
    displayName: Publish A2A and core alpha packages to the dev feed (internal manual runs only)
    type: boolean
    default: false

variables:
  - ${{ if and(parameters.PublishA2AAlpha, eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.Reason'], 'Manual')) }}:
      - name: SetDevVersion
        value: 'true'
      - name: Skip.Release
        value: 'true'

trigger:
  branches:
    include:
      - main
      - hotfix/*
      - release/*
      - restapi*
  paths:
    include:
      - sdk/agentserver/
      - sdk/core/

pr:
  branches:
    include:
      - main
      - feature/*
      - hotfix/*
      - release/*
      - restapi*
  paths:
    include:
      - sdk/agentserver/
      - sdk/core/

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    ServiceDirectory: agentserver
    TestProxy: true
    BuildDocs: true
    TestTimeoutInMinutes: 60
    MatrixConfigs:
      - Name: agentserver
        Path: sdk/agentserver/platform-matrix.json
        Selection: sparse
        GenerateVMJobs: true
    Artifacts:
      - name: azure-ai-agentserver-a2a
        safeName: azureaiagentservera2a
      - name: azure-ai-agentserver-core
        safeName: azureaiagentservercore
      - ${{ if not(and(parameters.PublishA2AAlpha, eq(variables['System.TeamProject'], 'internal'), eq(variables['Build.Reason'], 'Manual'))) }}:
          - name: azure-ai-agentserver-invocations
            safeName: azureaiagentserverinvocations
          - name: azure-ai-agentserver-responses
            safeName: azureaiagentserverresponses
          - name: azure-ai-agentserver-optimization
            safeName: azureaiagentserveroptimization
          - name: azure-ai-agentserver-activity
            safeName: azureaiagentserveractivity
