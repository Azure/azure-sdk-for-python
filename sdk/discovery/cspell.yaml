# cspell configuration for this service. Words are case-insensitive and
# kept sorted alphabetically. The import of the central config is required.
import:
  - ../../.vscode/cspell.json
words:
  - delv
  - invst
  - milli
  - sdktestdelv
  - wkspc
ignorePaths:
  - sdk/discovery/azure-ai-discovery/**/generated_samples/**
  - sdk/discovery/azure-ai-discovery/**/generated_tests/**
