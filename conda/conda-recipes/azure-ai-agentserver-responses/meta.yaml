{% set name = "azure-ai-agentserver-responses" %}

package:
  name: "{{ name|lower }}"
  version: {{ environ.get('AZURESDK_CONDA_VERSION', '0.0.0') }}

source:
  url: {{ environ.get('RESPONSES_SOURCE_DISTRIBUTION', '') }}

build:
  noarch: python
  number: 0
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - azure-core >={{ environ.get('AZURESDK_CONDA_VERSION', '0.0.0') }}
    - aiohttp>=3.10.0,<4.0.0a0
    - isodate>=0.6.1,<1.0.0
    - pip
    - aiohttp
    - azure-ai-agentserver-core >={{ environ.get('AZURESDK_CONDA_VERSION', '0.0.0') }}
    - python
  run:
    - azure-core >={{ environ.get('AZURESDK_CONDA_VERSION', '0.0.0') }}
    - aiohttp>=3.10.0,<4.0.0a0
    - isodate>=0.6.1,<1.0.0
    - aiohttp
    - azure-ai-agentserver-core >={{ environ.get('AZURESDK_CONDA_VERSION', '0.0.0') }}
    - python

test:
  imports:
    - azure.ai.agentserver.responses
    - azure.ai.agentserver.responses.aio
    - azure.ai.agentserver.responses.models

about:
  home: "https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/agentserver/azure-ai-agentserver-responses"
  license: MIT
  license_family: MIT
  license_file: 
  summary: "Microsoft Azure Agentserver Client Library for Python"
  description: |
    This is the Microsoft Azure Agentserver Client Library for Python.
    Please see https://aka.ms/azsdk/conda/releases/agentserver for version details.
  doc_url: 
  dev_url: 

extra:
  recipe-maintainers:
    - jennypng
    - kashifkhan-msft
