# This pipeline is triggered only for pr
trigger: none

pr:
  branches:
    include:
    - main
    - feature/*
    - hotfix/*
    - release/*
    - restapi*
  paths:
    include:
    - sdk/core/

variables:
  NodeVersion: '24.x'
  PythonVersion: '3.12'

jobs:
  - job: 'Core_Compatibility'
    displayName: 'Generated client core compatibility'
    timeoutInMinutes: 60

    pool:
      name: azsdk-pool
      vmImage: 'ubuntu-22.04'

    steps:
      - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
      - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
        parameters:
          EnableTwineAuth: false
      - task: NodeTool@0
        displayName: 'Install Node.js $(NodeVersion)'
        inputs:
          versionSpec: '$(NodeVersion)'

      - task: UsePythonVersion@0
        displayName: 'Use Python $(PythonVersion)'
        inputs:
          versionSpec: $(PythonVersion)

      - script: >
          python eng/scripts/core_compatibility.py run
          --sdk-root "$(Build.SourcesDirectory)"
          --work-dir "$(Agent.TempDirectory)/core-compatibility"
        displayName: 'Test TypeSpec Azure clients and legacy core compatibility'

      - task: PublishTestResults@2
        displayName: 'Publish core compatibility results'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: '$(Agent.TempDirectory)/core-compatibility/results/*.xml'
          testRunTitle: 'Generated client core compatibility'
          failTaskOnFailedTests: true

      - task: PublishPipelineArtifact@1
        displayName: 'Publish compatibility diagnostics'
        condition: failed()
        inputs:
          targetPath: '$(Agent.TempDirectory)/core-compatibility/results'
          artifact: 'core-compatibility-diagnostics'
