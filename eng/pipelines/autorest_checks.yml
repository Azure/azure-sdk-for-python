# This pipeline is triggered only for pr
trigger: none

pr:
  branches:
    include:
    - main
    - feature/*
    - hotfix/*
    - release/*
    - restapi*
  paths:
    include:
    - sdk/core/

variables:
  NodeVersion: '18.x'
  PythonVersion: '3.11'
  auto_rest_clone_url: 'https://github.com/Azure/autorest.python.git'
  source_path_azure_core: 'sdk/core/azure-core'
  source_path_azure_mgmt_core: 'sdk/core/azure-mgmt-core'

jobs:
  - job: 'Run_AutoRest'
    displayName: 'Run AutoRest'

    pool:
      name: azsdk-pool
      vmImage: 'ubuntu-22.04'

    steps:
      - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml
      - task: NodeTool@0
        displayName: 'Install Node.js $(NodeVersion)'
        inputs:
          versionSpec: '$(NodeVersion)'

      - task: UsePythonVersion@0
        displayName: 'Use Python $(PythonVersion)'
        inputs:
          versionSpec: $(PythonVersion)

      - script: |
          set -euo pipefail
          git clone $(auto_rest_clone_url)
          # Legacy clients are checked in; they need the test server, not the generator workspace.
          test_server_version=$(node -p "require('$(Build.SourcesDirectory)/autorest.python/packages/autorest.python/package.json').devDependencies['@microsoft.azure/autorest.testserver']")
          test_server_directory="$(Agent.TempDirectory)/autorest-testserver"
          mkdir -p "$test_server_directory"
          cd "$test_server_directory"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "@microsoft.azure/autorest.testserver@$test_server_version"
          ln -s "$test_server_directory/node_modules" "$(Build.SourcesDirectory)/autorest.python/packages/autorest.python/node_modules"
        displayName: 'Prepare Environment'

      - script: |
          set -euo pipefail
          cd $(Build.SourcesDirectory)/autorest.python/packages/autorest.python/test/vanilla/legacy
          python -m pip install -r requirements.txt
          python -m pip install $(Build.SourcesDirectory)/$(source_path_azure_core)
          pip freeze
          pytest $(Build.SourcesDirectory)/autorest.python/packages/autorest.python/test/vanilla/legacy
        displayName: 'Install azure-core and Test Vanilla Legacy'

      - script: |
          set -euo pipefail
          cd $(Build.SourcesDirectory)/autorest.python/packages/autorest.python/test/azure/legacy
          python -m pip install -r requirements.txt
          python -m pip install $(Build.SourcesDirectory)/$(source_path_azure_core) $(Build.SourcesDirectory)/$(source_path_azure_mgmt_core)
          pip freeze
          pytest $(Build.SourcesDirectory)/autorest.python/packages/autorest.python/test/azure/legacy
        displayName: 'Install azure-mgmt-core and Test Azure Legacy'
