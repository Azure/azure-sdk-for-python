# Updates the Python emitter package dependencies through the authenticated CFS feed,
# resolves upstream pnpm catalog references, regenerates the lock file, and opens
# a draft pull request when files change.
trigger: none
pr: none

variables:
  NodeVersion: '24.x'

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    stages:
      - stage: UpdateEmitterPackage
        displayName: Update emitter package
        jobs:
          - job: UpdateEmitterPackage
            displayName: Update emitter package
            timeoutInMinutes: 30
            pool:
              name: azsdk-pool
              image: ubuntu-24.04
              os: linux
            steps:
              - checkout: self

              - task: NodeTool@0
                displayName: Install Node.js $(NodeVersion)
                inputs:
                  versionSpec: $(NodeVersion)

              - template: /eng/common/pipelines/templates/steps/create-authenticated-npmrc.yml

              # @typespec/http-client-python installs its Python generator during npm install,
              # so lock-file generation also requires authenticated access to the Python CFS feed.
              - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
                parameters:
                  EnableTwineAuth: false
                  EnableUvAuth: false

              - script: npm install --global npm-check-updates @azure-tools/typespec-client-generator-cli
                displayName: Install emitter update tools

              - task: PowerShell@2
                displayName: Update emitter package dependencies
                inputs:
                  pwsh: true
                  targetType: inline
                  script: |
                    $ErrorActionPreference = 'Stop'

                    . (Join-Path '$(Build.SourcesDirectory)' 'eng' 'common' 'scripts' 'Helpers' 'PSModule-Helpers.ps1')
                    Install-ModuleIfNotInstalled 'powershell-yaml' '0.4.7' | Import-Module

                    $packageJsonPath = Join-Path '$(Build.SourcesDirectory)' 'eng' 'emitter-package.json'
                    $alignmentSources = [ordered]@{
                      'azure-rest-api-specs' = @{
                        repository = 'Azure/azure-rest-api-specs'
                        ref = 'main'
                        packages = @(
                          '@azure-tools/openai-typespec'
                          '@azure-tools/typespec-liftr-base'
                        )
                      }
                    }

                    Write-Host "Updating dependencies in $packageJsonPath"
                    ncu --packageFile $packageJsonPath --upgrade
                    if ($LASTEXITCODE) {
                      throw "npm-check-updates failed with exit code $LASTEXITCODE"
                    }

                    $packageJson = Get-Content $packageJsonPath -Raw | ConvertFrom-Json -AsHashtable

                    foreach ($sourceName in $alignmentSources.Keys | Sort-Object) {
                      $source = $alignmentSources[$sourceName]
                      $encodedRef = [Uri]::EscapeDataString($source.ref)
                      $commitUrl = "https://api.github.com/repos/$($source.repository)/commits/$encodedRef"
                      $commit = Invoke-RestMethod -Uri $commitUrl
                      $sha = $commit.sha
                      if ($sha -notmatch '^[0-9a-f]{40}$') {
                        throw "Could not resolve '$($source.ref)' to a commit for alignment source '$sourceName' ($commitUrl)"
                      }

                      # Use immutable URLs so package.json and its catalogs stay consistent.
                      $sourceRoot = "https://raw.githubusercontent.com/$($source.repository)/$sha"
                      $packageJsonUrl = "$sourceRoot/package.json"
                      $workspaceUrl = "$sourceRoot/pnpm-workspace.yaml"

                      Write-Host "Reading aligned package versions from $sourceName at $sha ($packageJsonUrl)"
                      $sourcePackageJson = Invoke-RestMethod -Uri $packageJsonUrl
                      $workspace = $null

                      foreach ($packageName in $source.packages) {
                        $alignedVersion = $sourcePackageJson.dependencies.$packageName
                        if (-not $alignedVersion) {
                          $alignedVersion = $sourcePackageJson.devDependencies.$packageName
                        }
                        if ($alignedVersion -isnot [string] -or [string]::IsNullOrWhiteSpace($alignedVersion)) {
                          throw "Package '$packageName' has no valid version in dependencies or devDependencies at $packageJsonUrl"
                        }

                        if ($alignedVersion.StartsWith('catalog:')) {
                          $catalogReference = $alignedVersion
                          if ($null -eq $workspace) {
                            Write-Host "Resolving '$catalogReference' for '$packageName' from $sourceName ($workspaceUrl)"
                            $workspaceResponse = Invoke-WebRequest -Uri $workspaceUrl
                            $workspace = ConvertFrom-Yaml -Yaml $workspaceResponse.Content
                            if ($workspace -isnot [System.Collections.IDictionary]) {
                              throw "Invalid workspace configuration for package '$packageName' from source '$sourceName' at $workspaceUrl"
                            }
                          }

                          $catalogName = $catalogReference.Substring('catalog:'.Length)
                          if ([string]::IsNullOrEmpty($catalogName) -or $catalogName -eq 'default') {
                            $catalog = $workspace['catalog']
                          } else {
                            $catalogs = $workspace['catalogs']
                            $catalog = $null
                            if ($catalogs -is [System.Collections.IDictionary]) {
                              $catalog = $catalogs[$catalogName]
                            }
                          }

                          if ($catalog -isnot [System.Collections.IDictionary] -or -not $catalog.Contains($packageName)) {
                            throw "Cannot resolve '$catalogReference' for package '$packageName' from source '$sourceName': catalog or package entry is missing at $workspaceUrl"
                          }

                          $alignedVersion = $catalog[$packageName]
                          if ($alignedVersion -isnot [string] -or [string]::IsNullOrWhiteSpace($alignedVersion)) {
                            throw "Cannot resolve '$catalogReference' for package '$packageName' from source '$sourceName': the entry at $workspaceUrl must be a nonempty version string"
                          }
                        }

                        if ($alignedVersion -match '^\s*(catalog|workspace|link|patch):') {
                          throw "Unsupported reference '$alignedVersion' for package '$packageName' from source '$sourceName' at commit '$sha'. Provide an npm-compatible version in the upstream manifest or catalog."
                        }

                        $targetSection = @('dependencies', 'devDependencies') |
                          Where-Object {
                            $packageJson[$_] -is [System.Collections.IDictionary] -and
                            $packageJson[$_].Contains($packageName)
                          } |
                          Select-Object -First 1
                        if (-not $targetSection) {
                          throw "Package '$packageName' from alignment source '$sourceName' was not found in $packageJsonPath"
                        }

                        Write-Host "Aligning $packageName to $alignedVersion"
                        $packageJson[$targetSection][$packageName] = $alignedVersion
                      }
                    }

                    $packageJson | ConvertTo-Json -Depth 100 | Set-Content $packageJsonPath

              - script: tsp-client generate-lock-file
                displayName: Regenerate emitter package lock file
                workingDirectory: $(Build.SourcesDirectory)

              - template: /eng/common/pipelines/templates/steps/create-pull-request.yml
                parameters:
                  BaseBranchName: refs/heads/main
                  PRBranchName: automated/update-emitter-package-$(Build.BuildId)
                  PROwner: Azure
                  CommitMsg: '[Automation] Update emitter package dependencies'
                  PRTitle: '[Automation] Update emitter package dependencies'
                  PRBody: |
                    This automated PR updates the emitter package dependencies through the authenticated Azure SDK CFS feed and regenerates the lock file.
                  OpenAsDraft: true
                  AuthToken: ''
