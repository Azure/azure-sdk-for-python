# Emits the `Release_<safeName>` stage for a single artifact.
#
# Extracted verbatim from archetype-python-release.yml so the release jobs keep exactly one
# definition. Artifacts that ship compiled binaries release from a different pipeline artifact
# (`packages_<safeName>_signed`) and depend on a different upstream stage (`Sign_<safeName>`)
# than everything else. Parameterizing just those two values here avoids forking the release
# job definitions into signed and unsigned copies that would inevitably drift.
#
# Callers resolve ArtifactName and DependsOn per artifact; every job below is otherwise
# unchanged from the shared release workflow.

parameters:
  - name: Artifact
    type: object
  # Pipeline artifact this package releases from. `packages_extended` for ordinary packages,
  # `packages_<safeName>_signed` for packages that opted in with `signBinaries: true`.
  - name: ArtifactName
    type: string
  # Upstream stage. The build stage for ordinary packages, `Sign_<safeName>` when signing.
  - name: DependsOn
    type: string
  - name: ServiceDirectory
    type: string
    default: 'not-specified'
  - name: TestPipeline
    type: boolean
    default: false
  - name: DocArtifact
    type: string
    default: 'documentation'
  - name: DevFeedName
    type: string
    default: 'public/azure-sdk-for-python'
  - name: PublicFeed
    type: string
    default: PyPi
  - name: PublicPublishEnvironment
    type: string
    default: package-publish
  - name: TargetDocRepoOwner
    type: string
    default: ''
  - name: TargetDocRepoName
    type: string
    default: ''

stages:
  - stage: 'Release_${{parameters.Artifact.safename}}'
    displayName: 'Release: ${{parameters.Artifact.name}}'
    dependsOn:
      - ${{ parameters.DependsOn }}
      - ${{ if and(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
          - AutoReleasePrepare
    variables:
      - template: /eng/pipelines/templates/variables/image.yml
      - template: /eng/common/pipelines/templates/variables/api-review-break-glass.yml
    # Auto-release CI: only release when the shared prepare stage flagged this artifact as changed.
    # Manual runs: every declared artifact remains eligible (existing behavior).
    ${{ if and(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
      condition: and(succeeded(), eq(dependencies.AutoReleasePrepare.outputs['ResolveAutoReleasePackages.resolve.ReleaseArtifact_${{ parameters.Artifact.safename }}'], 'true'), ne(variables['SetDevVersion'], 'true'), ne(variables['Skip.Release'], 'true'), ne(variables['Build.Repository.Name'], 'Azure/azure-sdk-for-python-pr'))
    ${{ else }}:
      condition: and(succeeded(), ne(variables['SetDevVersion'], 'true'), ne(variables['Skip.Release'], 'true'), ne(variables['Build.Repository.Name'], 'Azure/azure-sdk-for-python-pr'))
    jobs:
      - job: TagRepository
        displayName: "Create release tag"
        condition: and(succeeded(), ne(variables['Skip.TagRepository'], 'true'))

        pool:
          image: ubuntu-24.04
          name: azsdk-pool
          os: linux

        steps:
          - checkout: self

          - download: current
            artifact: ${{parameters.ArtifactName}}
            timeoutInMinutes: 5

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.12'

          - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
            parameters:
              DevFeedName: ${{ parameters.DevFeedName }}

          - template: /eng/common/pipelines/templates/steps/retain-run.yml

          - template: /eng/common/pipelines/templates/steps/set-test-pipeline-version.yml
            parameters:
              PackageName: "azure-template"
              ServiceDirectory: "template"
              TestPipeline: ${{ parameters.TestPipeline }}

          - template: /eng/common/pipelines/templates/steps/verify-changelog.yml
            parameters:
              PackageName: ${{parameters.Artifact.name}}
              ServiceName: ${{parameters.ServiceDirectory}}
              ForRelease: true

          - template: /eng/common/pipelines/templates/steps/verify-restapi-spec-location.yml
            parameters:
              PackageName: ${{parameters.Artifact.name}}
              ServiceDirectory: ${{parameters.ServiceDirectory}}
              ArtifactLocation: $(Pipeline.Workspace)/${{parameters.ArtifactName}}

          - script: |
              python -m pip install "./eng/tools/azure-sdk-tools"
            displayName: Install tool dependencies

          - task: PythonScript@0
            displayName: Verify Dependency Presence
            condition: and(succeeded(), ne(variables['Skip.VerifyDependencies'], 'true'))
            inputs:
              scriptPath: 'scripts/devops_tasks/verify_dependencies_present.py'
              arguments: '--package-name ${{ parameters.Artifact.name }} --service ${{ parameters.ServiceDirectory }}'

          - task: PythonScript@0
            displayName: Verify CI enabled
            condition: succeeded()
            inputs:
              scriptPath: 'scripts/devops_tasks/verify_ci_enabled.py'
              arguments: '--package-name ${{ parameters.Artifact.name }} --service ${{ parameters.ServiceDirectory }}'

          - pwsh: |
              Get-ChildItem -Recurse $(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}
            workingDirectory: $(Pipeline.Workspace)
            displayName: Output Visible Artifacts

          - template: /eng/common/pipelines/templates/steps/create-tags-and-git-release.yml
            parameters:
              ArtifactLocation: $(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}
              PackageRepository: PyPI
              ReleaseSha: $(Build.SourceVersion)
              RepoId: Azure/azure-sdk-for-python
              WorkingDirectory: $(System.DefaultWorkingDirectory)
              AuthToken: ''

      - ${{if ne(parameters.Artifact.skipPublishPackage, 'true')}}:
          - deployment: PublishPackage
            displayName: "Publish to ${{ parameters.PublicFeed }}"
            condition: and(succeeded(), ne(variables['Skip.PublishPackage'], 'true'))
            # Auto-release runs after merge on main and must not wait on the package-publish approval gate.
            ${{ if and(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
              environment: none
            ${{ else }}:
              environment: ${{ parameters.PublicPublishEnvironment }}
            dependsOn: TagRepository

            templateContext:
              type: releaseJob
              isProduction: true
              inputs:
                - input: pipelineArtifact
                  artifactName: release_artifact
                  targetPath: $(Pipeline.Workspace)/release_artifact
                - input: pipelineArtifact
                  artifactName: packages_extended
                  targetPath: $(Pipeline.Workspace)/packages_extended

            pool:
              image: ubuntu-24.04
              name: azsdk-pool
              os: linux

            strategy:
              runOnce:
                deploy:
                  steps:
                    - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
                      parameters:
                        DevFeedName: ${{ parameters.DevFeedName }}
                        EnableTwineAuth: false
                        EnablePipAuth: true
                        EnableUvAuth: false

                    - task: UsePythonVersion@0
                      inputs:
                        versionSpec: '3.10'

                    - script: |
                        python -m pip install -r $(Pipeline.Workspace)/release_artifact/release_requirements.txt
                      displayName: Install Release Dependencies

                    - ${{ if eq(parameters.PublicFeed, 'PyPi') }}:
                        - pwsh: |
                            $esrpDirectory = "$(Pipeline.Workspace)/esrp-release/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}"
                            New-Item -ItemType Directory -Force -Path $esrpDirectory

                            Get-ChildItem -Path "$(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}" `
                              | Where-Object { ($_.Name -like "*.tar.gz" -or $_.Name -like "*.whl") } `
                              | Copy-Item -Destination $esrpDirectory

                            Get-ChildItem $esrpDirectory
                          displayName: Isolate files for ESRP Publish

                        - template: /eng/pipelines/templates/steps/esrp-publish.yml
                          parameters:
                            targetFolder: "$(Pipeline.Workspace)/esrp-release/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}"

                    - ${{ if ne(parameters.PublicFeed, 'PyPi') }}:
                        - task: TwineAuthenticate@0
                          displayName: 'Authenticate to feed: ${{parameters.PublicFeed}}'
                          inputs:
                            artifactFeeds: ${{parameters.PublicFeed}}

                        - script: |
                            set -e
                            twine upload --repository ${{parameters.PublicFeed}} --config-file $(PYPIRC_PATH) $(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}/*.whl
                            echo "Uploaded whl to devops feed"
                            twine upload --repository ${{parameters.PublicFeed}} --config-file $(PYPIRC_PATH) $(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}/*.tar.gz
                            echo "Uploaded sdist to devops feed"
                          displayName: 'Publish package to feed: ${{parameters.PublicFeed}}'

                    - task: TwineAuthenticate@0
                      displayName: 'Authenticate to feed: ${{parameters.DevFeedName}}'
                      inputs:
                        artifactFeeds: ${{parameters.DevFeedName}}

                    - script: |
                        set -e
                        twine upload --repository ${{parameters.DevFeedName}} --config-file $(PYPIRC_PATH) $(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}/*.whl
                        echo "Uploaded whl to devops feed"
                        twine upload --repository ${{parameters.DevFeedName}} --config-file $(PYPIRC_PATH) $(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}/*.tar.gz
                        echo "Uploaded sdist to devops feed"
                      displayName: 'Publish package to feed: ${{parameters.DevFeedName}}'

      - job: MarkPackageReleaseCompletion
        displayName: "Mark package release completion"
        dependsOn: PublishPackage

        pool:
          image: ubuntu-24.04
          name: azsdk-pool
          os: linux

        steps:
          - checkout: self

          - download: current
            artifact: ${{parameters.ArtifactName}}
            timeoutInMinutes: 5

          - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
            parameters:
              DevFeedName: ${{ parameters.DevFeedName }}
              EnableTwineAuth: false
              EnablePipAuth: true
              EnableUvAuth: false

          - template: /eng/common/pipelines/templates/steps/mark-release-completion.yml
            parameters:
              ConfigFileDir: '$(Pipeline.Workspace)/${{parameters.ArtifactName}}/PackageInfo'
              PackageArtifactName: ${{parameters.Artifact.name}}

          # Management-plane-only workaround: skip marking packages that do not generate an APIView revision.
          - pwsh: |
              $packageInfoPath = '$(Pipeline.Workspace)/${{parameters.ArtifactName}}/PackageInfo/${{ parameters.Artifact.name }}.json'
              $packageInfo = Get-Content -Raw -Path $packageInfoPath | ConvertFrom-Json
              $isManagementPackage = $packageInfo.SdkType -eq 'mgmt'
              Write-Host "##vso[task.setvariable variable=IsManagementPackage]$isManagementPackage"
            displayName: Check package SDK type

          - task: AzureCLI@2
            displayName: Mark Package Released
            condition: >-
              and(
                succeeded(),
                ne(variables['IsManagementPackage'], 'true'),
                not(
                  and(
                    eq(variables['Skip.MarkPackageReleased'], 'true'),
                    eq(variables['IsRequesterAuthorizedToSkipApiReview'], 'true')
                  )
                )
              )
            inputs:
              azureSubscription: "ADO to ARH Service Connection"
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: $(Build.SourcesDirectory)/eng/common/scripts/Mark-PackageReleased.ps1
              arguments: >
                -PackageInfoFiles @('$(Pipeline.Workspace)/${{parameters.ArtifactName}}/PackageInfo/${{ parameters.Artifact.name }}.json')
                -RepoOwner 'Azure'
                -AzSdkExePath '$(AZSDK)'
              workingDirectory: $(Pipeline.Workspace)

      - ${{if ne(parameters.Artifact.skipPublishDocGithubIo, 'true')}}:
          - job: PublishGitHubIODocs
            displayName: Publish Docs to GitHubIO Blob Storage
            condition: >-
              and(
                succeeded(), 
                ne(variables['Skip.PublishDocs'], 'true'), 
                ne(variables['Build.Repository.Name'], 'Azure/azure-sdk-for-python-pr')
              )
            dependsOn: PublishPackage

            pool:
              name: azsdk-pool
              image: windows-2022
              os: windows

            steps:
              - checkout: self

              - download: current
                artifact: ${{parameters.ArtifactName}}
                timeoutInMinutes: 5

              - download: current
                artifact: ${{parameters.DocArtifact}}
                timeoutInMinutes: 5

              - pwsh: |
                  if (Test-Path "$(Pipeline.Workspace)/${{parameters.DocArtifact}}/${{parameters.Artifact.name}}") {
                    Get-ChildItem -Recurse "$(Pipeline.Workspace)/${{parameters.DocArtifact}}/${{parameters.Artifact.name}}"
                  }
                  else {
                    New-Item -ItemType Directory -Force -Path "$(Pipeline.Workspace)/${{parameters.DocArtifact}}/${{parameters.Artifact.name}}"
                  }
                workingDirectory: $(Pipeline.Workspace)
                displayName: Output Visible Artifacts

              - template: /eng/common/pipelines/templates/steps/publish-blobs.yml
                parameters:
                  FolderForUpload: '$(Pipeline.Workspace)/${{parameters.DocArtifact}}/${{parameters.Artifact.name}}'
                  TargetLanguage: 'python'
                  ArtifactLocation: '$(Pipeline.Workspace)/${{parameters.ArtifactName}}/${{parameters.Artifact.name}}'

      - ${{if ne(parameters.Artifact.skipPublishDocMs, 'true')}}:
          - job: PublishDocs
            displayName: Docs.MS Release
            condition: >-
              and(
                succeeded(), 
                ne(variables['Skip.PublishDocs'], 'true'), 
                ne(variables['Build.Repository.Name'], 'Azure/azure-sdk-for-python-pr')
              )
            dependsOn: PublishPackage

            pool:
              image: ubuntu-24.04
              name: azsdk-pool
              os: linux

            steps:
              - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
                parameters:
                  Paths:
                    - sdk/**/*.md
                    - .github/CODEOWNERS

              - download: current

              # py2docfx requires Python >= 3.12.x, match docs pipeline version specification
              - task: UsePythonVersion@0
                displayName: 'Use Python 3.12.x'
                inputs:
                  versionSpec: '3.12.x'

              - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
                parameters:
                  DevFeedName: ${{ parameters.DevFeedName }}

              - template: /eng/pipelines/templates/steps/install-rex-validation-tool.yml

              - template: /eng/common/pipelines/templates/steps/update-docsms-metadata.yml
                parameters:
                  PackageInfoLocations:
                    - $(Pipeline.Workspace)/${{parameters.ArtifactName}}/PackageInfo/${{parameters.Artifact.name}}.json
                  WorkingDirectory: $(System.DefaultWorkingDirectory)
                  TargetDocRepoOwner: ${{parameters.TargetDocRepoOwner}}
                  TargetDocRepoName: ${{parameters.TargetDocRepoName}}
                  Language: 'python'
                  SparseCheckoutPaths:
                    - docs-ref-services/
                    - metadata/

      - job: UpdatePackageVersion
        displayName: "Update Package Version"
        condition: and(succeeded(), ne(variables['Skip.UpdatePackageVersion'], 'true'))
        dependsOn: PublishPackage

        pool:
          image: ubuntu-24.04
          name: azsdk-pool
          os: linux

        steps:
          - checkout: self
          - task: UsePythonVersion@0

          - template: /eng/pipelines/templates/steps/auth-dev-feed.yml
            parameters:
              DevFeedName: ${{ parameters.DevFeedName }}

          - script: |
              python -m pip install "./eng/tools/azure-sdk-tools"
            displayName: Install versioning tool dependencies

          - pwsh: |
              sdk_increment_version --package-name ${{ parameters.Artifact.name }} --service ${{ parameters.ServiceDirectory }}
              if (Test-Path component-detection-pip-report.json) {
                Write-Host "Deleting component-detection-pip-report.json"
                rm component-detection-pip-report.json
              }
            displayName: Increment package version

          - template: /eng/common/pipelines/templates/steps/create-pull-request.yml
            parameters:
              RepoName: azure-sdk-for-python
              PRBranchName: increment-package-version-${{ parameters.ServiceDirectory }}-$(Build.BuildId)
              CommitMsg: "Increment package version after release of ${{ parameters.Artifact.name }}"
              PRTitle: "Increment version for ${{ parameters.ServiceDirectory }} releases"
              CloseAfterOpenForTesting: '${{ parameters.TestPipeline }}'
              AuthToken: ''

      - ${{if and(eq(variables['Build.Reason'], 'Manual'), eq(variables['System.TeamProject'], 'internal'))}}:
          - template: /eng/pipelines/templates/jobs/smoke.tests.yml
            parameters:
              Daily: false
              ArtifactName: ${{ parameters.ArtifactName }}
              Artifact: ${{ parameters.Artifact }}
              DevFeedName: ${{ parameters.DevFeedName }}
