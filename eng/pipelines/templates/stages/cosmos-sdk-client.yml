parameters:
- name: Artifacts
  type: object
  default: []
- name: ServiceDirectory
  type: string
  default: not-specified
- name: InjectedPackages
  type: string
  default: ''
- name: TestProxy
  type: boolean
  default: false
- name: InstallMsRustToolchain
  type: boolean
  default: false
- name: RunRustTests
  type: boolean
  default: false
- name: MsRustWorkingDirectory
  type: string
  default: ''
- name: MsRustToolchainFeed
  type: string
  default: ''
- name: MsRustAdditionalTargets
  type: string
  default: ''

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    # Run only emulator tests in Emulator CI
    TestMarkArgument: cosmosEmulator
    ServiceDirectory: cosmos
    InstallMsRustToolchain: ${{ parameters.InstallMsRustToolchain }}
    MsRustWorkingDirectory: ${{ parameters.MsRustWorkingDirectory }}
    MsRustToolchainFeed: ${{ parameters.MsRustToolchainFeed }}
    MsRustAdditionalTargets: ${{ parameters.MsRustAdditionalTargets }}
    AdditionalJobs:
      - ${{ if parameters.RunRustTests }}:
        - template: /sdk/cosmos/templates/rust-tests.yml
          parameters:
            ToolchainFeed: ${{ parameters.MsRustToolchainFeed }}
    BeforeTestSteps:
      - template: /eng/common/pipelines/templates/steps/cosmos-emulator.yml
        parameters:
          StartParameters: '/noexplorer /noui /enablepreview /EnableSqlComputeEndpoint /SqlComputePort=9999 /disableratelimiting /partitioncount=50 /consistency=Session'
    MatrixConfigs:
      - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
        - Name: Python_cosmos_emulator
          Path: sdk/cosmos/cosmos-emulator-public-matrix.json
          Selection: all
          GenerateVMJobs: true
      - ${{ else }}:
        - Name: Python_cosmos_emulator
          Path: sdk/cosmos/cosmos-emulator-internal-matrix.json
          Selection: all
          GenerateVMJobs: true
    Artifacts: ${{ parameters.Artifacts }}
