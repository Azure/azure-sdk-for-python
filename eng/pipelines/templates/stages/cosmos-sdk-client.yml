parameters:
- name: Artifacts
  type: object
  default: []
- name: ServiceDirectory
  type: string
  default: not-specified
- name: InjectedPackages
  type: string
  default: ''
- name: TestProxy
  type: boolean
  default: false

extends:
  template: /eng/pipelines/templates/stages/archetype-sdk-client.yml
  parameters:
    # azure-cosmos compiles a Rust extension with the Microsoft internal toolchain,
    # so the build agents need msrustup and the toolchain named in the package's
    # rust-toolchain.toml.
    InstallMsRustToolchain: true
    MsRustWorkingDirectory: $(Build.SourcesDirectory)/sdk/cosmos/azure-cosmos
    # The Windows ARM64 wheel is cross-compiled from the x64 agent, so that target
    # has to be present in the toolchain. Keep in sync with the win_arm64 override
    # in the package's pyproject.toml.
    MsRustAdditionalTargets: aarch64-pc-windows-msvc
    # Run only emulator tests in Emulator CI
    TestMarkArgument: cosmosEmulator
    ServiceDirectory: cosmos
    BeforeTestSteps:
      - template: /eng/common/pipelines/templates/steps/cosmos-emulator.yml
        parameters:
          StartParameters: '/noexplorer /noui /enablepreview /EnableSqlComputeEndpoint /SqlComputePort=9999 /disableratelimiting /partitioncount=50 /consistency=Session'
    MatrixConfigs:
      - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
        - Name: Python_cosmos_emulator
          Path: sdk/cosmos/cosmos-emulator-public-matrix.json
          Selection: all
          GenerateVMJobs: true
      - ${{ else }}:
        - Name: Python_cosmos_emulator
          Path: sdk/cosmos/cosmos-emulator-internal-matrix.json
          Selection: all
          GenerateVMJobs: true
    Artifacts: ${{ parameters.Artifacts }}
