parameters:
  - name: ServiceDirectory
    type: string
    default: not-specified
  - name: ReleasePlanId
    type: string
    default: '0'
  - name: SkipPrValidation
    type: boolean
    default: false
  - name: Artifacts
    type: object
    default: []
  - name: TestPipeline
    type: boolean
    default: false
  - name: BeforeTestSteps
    type: object
    default: []
  - name: AfterTestSteps
    type: object
    default: []
  - name: ExcludePaths
    type: object
    default: []
  - name: BeforePublishSteps
    type: object
    default: []
  - name: TestMarkArgument
    type: string
    default: ''
  - name: BuildTargetingString
    type: string
    default: azure-*
  - name: TestTimeoutInMinutes
    type: number
    default: 60
  - name: BuildTimeoutInMinutes
    type: number
    default: 90
  - name: SbomGenerationTimeoutInMinutes
    type: number
    default: 30
  - name: InjectedPackages
    type: string
    default: ''
  - name: BuildDocs
    type: boolean
    default: true
  - name: DevFeedName
    type: string
    default: public/azure-sdk-for-python
  - name: PublicFeed
    type: string
    default: 'PyPi'
  - name: PublicPublishEnvironment
    type: string
    default: package-publish
  - name: TargetDocRepoOwner
    type: string
    default: MicrosoftDocs
  - name: TargetDocRepoName
    type: string
    default: azure-docs-sdk-python
  - name: MatrixConfigs
    type: object
    default:
      - Name: Python_ci_test_base
        Path: eng/pipelines/templates/stages/platform-matrix.json
        Selection: sparse
        GenerateVMJobs: true
  - name: AdditionalMatrixConfigs
    type: object
    default: []
  - name: MatrixFilters
    type: object
    default: []
  - name: MatrixReplace
    type: object
    default: []
  - name: VerifyAutorest
    type: boolean
    default: false
  - name: TestProxy
    type: boolean
    default: true
  - name: GenerateApiReviewForManualOnly
    type: boolean
    default: false
  - name: oneESTemplateTag
    type: string
    default: release
  - name: EnableCompiledCodeql
    type: boolean
    default: false
  - name: EnvVars
    type: object
    default: {}
  # Rust setup applies only to wheel jobs, not source-installing test or documentation jobs.
  - name: InstallMsRustToolchain
    type: boolean
    default: false
  # Package directory containing rust-toolchain.toml.
  - name: MsRustWorkingDirectory
    type: string
    default: ''
  # Required when Rust is enabled; no shared toolchain feed is selected by default.
  - name: MsRustToolchainFeed
    type: string
    default: ''
  # Space-separated Windows target triples; keep aligned with the package's wheel recipe.
  - name: MsRustAdditionalTargets
    type: string
    default: ''

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    oneESTemplateTag: ${{ parameters.oneESTemplateTag }}
    EnableCompiledCodeql: ${{ parameters.EnableCompiledCodeql }}
    stages:
      - ${{ if and(eq(parameters.SkipPrValidation, true), eq(variables['Build.Reason'], 'Manual')) }}:
        - stage: NoOp
          displayName: No-op
          variables:
            - template: /eng/pipelines/templates/variables/globals.yml
            - template: /eng/pipelines/templates/variables/image.yml
          jobs:
            - job: NoOp
              displayName: No-op
              pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
              steps:
                - checkout: none
                - pwsh: Write-Host "PR validation skipped because SkipPrValidation was set to true for a manual run."
                  displayName: Skip PR validation

      - stage: Build
        condition: not(and(eq(${{ parameters.SkipPrValidation }}, true), eq(variables['Build.Reason'], 'Manual')))
        jobs:
          - template: /eng/pipelines/templates/jobs/ci.yml
            parameters:
              ServiceDirectory: ${{ parameters.ServiceDirectory }}
              Artifacts: ${{ parameters.Artifacts }}
              ${{ if eq(parameters.ServiceDirectory, 'template') }}:
                TestPipeline: true
              BeforeTestSteps: ${{ parameters.BeforeTestSteps }}
              AfterTestSteps: ${{ parameters.AfterTestSteps }}
              ExcludePaths: ${{ parameters.ExcludePaths }}
              BeforePublishSteps: ${{ parameters.BeforePublishSteps }}
              TestMarkArgument: ${{ parameters.TestMarkArgument }}
              BuildTargetingString: ${{ parameters.BuildTargetingString }}
              TestTimeoutInMinutes: ${{ parameters.TestTimeoutInMinutes }}
              BuildTimeoutInMinutes: ${{ parameters.BuildTimeoutInMinutes }}
              SbomGenerationTimeoutInMinutes: ${{ parameters.SbomGenerationTimeoutInMinutes }}
              InjectedPackages: ${{ parameters.InjectedPackages }}
              BuildDocs: ${{ parameters.BuildDocs }}
              DevFeedName: ${{ parameters.DevFeedName }}
              EnvVars: ${{ parameters.EnvVars }}
              InstallMsRustToolchain: ${{ parameters.InstallMsRustToolchain }}
              MsRustWorkingDirectory: ${{ parameters.MsRustWorkingDirectory }}
              MsRustToolchainFeed: ${{ parameters.MsRustToolchainFeed }}
              MsRustAdditionalTargets: ${{ parameters.MsRustAdditionalTargets }}
              MatrixConfigs:
                - ${{ each config in parameters.MatrixConfigs }}:
                    - ${{ config }}
                - ${{ each config in parameters.AdditionalMatrixConfigs }}:
                    - ${{ config }}
              MatrixFilters: ${{ parameters.MatrixFilters }}
              MatrixReplace: ${{ parameters.MatrixReplace }}
              VerifyAutorest: ${{ parameters.VerifyAutorest }}
              TestProxy: ${{ parameters.TestProxy }}
              GenerateApiReviewForManualOnly: ${{ parameters.GenerateApiReviewForManualOnly }}

          - ${{ if and(gt(length(parameters.Artifacts), 0), eq(variables['System.TeamProject'], 'internal'), or(in(variables['Build.Reason'], 'Manual', ''), and(eq(variables['Build.Reason'], 'IndividualCI'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))) }}:
              - job: CheckPackageApproval
                displayName: Check Package Approval Status
                dependsOn:
                  - Build_Extended
                  - Analyze
                condition: >-
                  and(
                    in(dependencies.Build_Extended.result, 'Succeeded', 'SucceededWithIssues'),
                    or(
                      in(dependencies.Analyze.result, 'Succeeded', 'SucceededWithIssues'),
                      and(
                        eq(dependencies.Analyze.result, 'Skipped'),
                        eq(variables['Skip.Analyze'], 'true')
                      )
                    )
                  )
                pool:
                  name: $(LINUXPOOL)
                  image: $(LINUXVMIMAGE)
                  os: linux
                steps:
                  - checkout: self
                    fetchDepth: 1
                    fetchTags: false
                    sparseCheckoutDirectories: |
                      eng/common
                      eng/scripts

                  - download: current
                    artifact: packages_extended

                  - pwsh: |
                      $artifacts = ConvertFrom-Json -InputObject $env:ARTIFACTS
                      $packageInfoFiles = @(
                        foreach ($artifact in $artifacts) {
                          $path = "packages_extended/PackageInfo/$($artifact.name).json"
                          if (Test-Path -LiteralPath $path -PathType Leaf) {
                            $path
                          }
                          else {
                            Write-Host "No package info exists for '$($artifact.name)'; skipping approval for this artifact."
                          }
                        }
                      )
                      $hasPackages = $packageInfoFiles.Count -gt 0
                      $paths = $packageInfoFiles -join "','"
                      Write-Host "##vso[task.setvariable variable=HasPackageApprovalPackages]$hasPackages"
                      Write-Host "##vso[task.setvariable variable=PackageApprovalInfoFiles]$paths"
                    displayName: Resolve package approval inputs
                    workingDirectory: $(Pipeline.Workspace)
                    env:
                      ARTIFACTS: ${{ convertToJson(parameters.Artifacts) }}

                  - template: /eng/common/pipelines/templates/steps/install-azsdk-cli.yml
                    parameters:
                      Condition: and(succeeded(), eq(variables['HasPackageApprovalPackages'], 'true'))

                  # Invoke the shared script directly to allow skipping a runtime-empty selection.
                  - task: AzureCLI@2
                    displayName: Check Package Approval Status
                    condition: >-
                      and(
                        succeeded(),
                        eq(variables['HasPackageApprovalPackages'], 'true'),
                        not(
                          and(
                            eq(variables['Skip.CheckPackageApproval'], 'true'),
                            eq(variables['IsRequesterAuthorizedToSkipApiReview'], 'true')
                          )
                        )
                      )
                    inputs:
                      azureSubscription: "ADO to ARH Service Connection"
                      scriptType: pscore
                      scriptLocation: scriptPath
                      scriptPath: $(Build.SourcesDirectory)/eng/common/scripts/Get-PackageApprovalStatus.ps1
                      arguments: >
                        -PackageInfoFiles @('$(PackageApprovalInfoFiles)')
                        -RepoOwner 'Azure'
                        -AzSdkExePath '$(AZSDK)'
                      workingDirectory: $(Pipeline.Workspace)

        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml
          - template: /eng/common/pipelines/templates/variables/api-review-break-glass.yml

      - template: archetype-python-release.yml
        parameters:
          DependsOn: "Build"
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          ReleasePlanId: ${{ parameters.ReleasePlanId }}
          Artifacts: ${{ parameters.Artifacts }}
          ${{ if eq(parameters.ServiceDirectory, 'template') }}:
            TestPipeline: true
          ArtifactName: packages_extended
          DocArtifact: documentation
          TargetDocRepoOwner: ${{ parameters.TargetDocRepoOwner }}
          TargetDocRepoName: ${{ parameters.TargetDocRepoName }}
          DevFeedName: ${{ parameters.DevFeedName }}
          PublicFeed: ${{ parameters.PublicFeed }}
          PublicPublishEnvironment: ${{ parameters.PublicPublishEnvironment }}
