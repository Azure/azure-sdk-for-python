parameters:
  - name: ServiceDirectory
    type: string
    default: not-specified
  - name: SkipPrValidation
    type: boolean
    default: false
  - name: Artifacts
    type: object
    default: []
  - name: TestPipeline
    type: boolean
    default: false
  - name: BeforeTestSteps
    type: object
    default: []
  - name: AfterTestSteps
    type: object
    default: []
  - name: ExcludePaths
    type: object
    default: []
  - name: BeforePublishSteps
    type: object
    default: []
  - name: TestMarkArgument
    type: string
    default: ''
  - name: BuildTargetingString
    type: string
    default: azure-*
  - name: TestTimeoutInMinutes
    type: number
    default: 60
  - name: InjectedPackages
    type: string
    default: ''
  - name: BuildDocs
    type: boolean
    default: true
  - name: DevFeedName
    type: string
    default: public/azure-sdk-for-python
  - name: PublicFeed
    type: string
    default: 'PyPi'
  - name: PublicPublishEnvironment
    type: string
    default: package-publish
  - name: TargetDocRepoOwner
    type: string
    default: MicrosoftDocs
  - name: TargetDocRepoName
    type: string
    default: azure-docs-sdk-python
  - name: MatrixConfigs
    type: object
    default:
      - Name: Python_ci_test_base
        Path: eng/pipelines/templates/stages/platform-matrix.json
        Selection: sparse
        GenerateVMJobs: true
  - name: AdditionalMatrixConfigs
    type: object
    default: []
  - name: MatrixFilters
    type: object
    default: []
  - name: MatrixReplace
    type: object
    default: []
  - name: VerifyAutorest
    type: boolean
    default: false
  - name: TestProxy
    type: boolean
    default: true
  - name: GenerateApiReviewForManualOnly
    type: boolean
    default: false
  - name: oneESTemplateTag
    type: string
    default: release
  - name: EnableCompiledCodeql
    type: boolean
    default: false
  - name: EnvVars
    type: object
    default: {}

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    oneESTemplateTag: ${{ parameters.oneESTemplateTag }}
    EnableCompiledCodeql: ${{ parameters.EnableCompiledCodeql }}
    stages:
      - ${{ if and(eq(parameters.SkipPrValidation, true), eq(variables['Build.Reason'], 'Manual')) }}:
        - stage: NoOp
          displayName: No-op
          variables:
            - template: /eng/pipelines/templates/variables/globals.yml
            - template: /eng/pipelines/templates/variables/image.yml
          jobs:
            - job: NoOp
              displayName: No-op
              pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
              steps:
                - checkout: none
                - pwsh: Write-Host "PR validation skipped because SkipPrValidation was set to true for a manual run."
                  displayName: Skip PR validation

      - stage: Build
        condition: not(and(eq(${{ parameters.SkipPrValidation }}, true), eq(variables['Build.Reason'], 'Manual')))
        jobs:
          - template: /eng/pipelines/templates/jobs/ci.yml
            parameters:
              ServiceDirectory: ${{ parameters.ServiceDirectory }}
              Artifacts: ${{ parameters.Artifacts }}
              ${{ if eq(parameters.ServiceDirectory, 'template') }}:
                TestPipeline: true
              BeforeTestSteps: ${{ parameters.BeforeTestSteps }}
              AfterTestSteps: ${{ parameters.AfterTestSteps }}
              ExcludePaths: ${{ parameters.ExcludePaths }}
              BeforePublishSteps: ${{ parameters.BeforePublishSteps }}
              TestMarkArgument: ${{ parameters.TestMarkArgument }}
              BuildTargetingString: ${{ parameters.BuildTargetingString }}
              TestTimeoutInMinutes: ${{ parameters.TestTimeoutInMinutes }}
              InjectedPackages: ${{ parameters.InjectedPackages }}
              BuildDocs: ${{ parameters.BuildDocs }}
              DevFeedName: ${{ parameters.DevFeedName }}
              EnvVars: ${{ parameters.EnvVars }}
              MatrixConfigs:
                - ${{ each config in parameters.MatrixConfigs }}:
                    - ${{ config }}
                - ${{ each config in parameters.AdditionalMatrixConfigs }}:
                    - ${{ config }}
              MatrixFilters: ${{ parameters.MatrixFilters }}
              MatrixReplace: ${{ parameters.MatrixReplace }}
              VerifyAutorest: ${{ parameters.VerifyAutorest }}
              TestProxy: ${{ parameters.TestProxy }}
              GenerateApiReviewForManualOnly: ${{ parameters.GenerateApiReviewForManualOnly }}

        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml

      - ${{ if eq(parameters.ServiceDirectory, 'storage') }}:
        - stage: Sign_Binaries
          displayName: Sign Extension Wheels
          dependsOn: Build
          condition: succeeded()
          jobs:
            - job: Sign_macOS
              displayName: Sign macOS Wheels
              pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
              steps:
                - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml

                - task: UsePythonVersion@0
                  displayName: "Use Python $(PythonVersion)"
                  inputs:
                    versionSpec: $(PythonVersion)

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: packages_mac
                    targetPath: $(Build.ArtifactStagingDirectory)/packages_mac

                - pwsh: |
                    Get-ChildItem
                    python eng/scripts/wheel_signing/extract_sign_inputs.py `
                      --platform mac `
                      --wheels-dir "$(Build.ArtifactStagingDirectory)/packages_mac" `
                      --work-dir "$(Build.ArtifactStagingDirectory)/mac-sign-work" `
                      --sign-input-zip "$(Build.ArtifactStagingDirectory)/mac-sign-input.zip"
                  displayName: Extract mac wheel binaries

                - template: pipelines/steps/azd-cli-mac-signing.yml@azure-sdk-build-tools
                  parameters:
                    MacPath: "$(Build.ArtifactStagingDirectory)"
                    MacPattern: "mac-sign-input.zip"
                    Notarize: false

                - pwsh: |
                    python eng/scripts/wheel_signing/repackage_signed_wheels.py `
                      --platform mac `
                      --work-dir "$(Build.ArtifactStagingDirectory)/mac-sign-work" `
                      --signed-input-zip "$(Build.ArtifactStagingDirectory)/mac-sign-input.zip" `
                      --output-wheels-dir "$(Build.ArtifactStagingDirectory)/mac-wheels-signed"
                  displayName: Repackage mac wheels

                - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
                  parameters:
                    ArtifactPath: '$(Build.ArtifactStagingDirectory)/mac-wheels-signed'
                    ArtifactName: 'packages_mac_signed'

            - job: Sign_Windows
              displayName: Sign Windows Wheels
              pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
              steps:
                - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml

                - task: UsePythonVersion@0
                  displayName: "Use Python $(PythonVersion)"
                  inputs:
                    versionSpec: $(PythonVersion)

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: packages_windows
                    targetPath: $(Build.ArtifactStagingDirectory)/packages_windows

                - pwsh: |
                    python eng/scripts/wheel_signing/extract_sign_inputs.py `
                      --platform windows `
                      --wheels-dir "$(Build.ArtifactStagingDirectory)/packages_windows" `
                      --work-dir "$(Build.ArtifactStagingDirectory)/win-sign-work" `
                      --sign-input-dir "$(Build.ArtifactStagingDirectory)/win-sign-input"
                  displayName: Extract windows wheel binaries

                - template: pipelines/steps/azd-cli-win-signing.yml@azure-sdk-build-tools
                  parameters:
                    WinPath: "$(Build.ArtifactStagingDirectory)/win-sign-input"
                    WinPattern: '**/*.pyd'

                - pwsh: |
                    python eng/scripts/wheel_signing/repackage_signed_wheels.py `
                      --platform windows `
                      --work-dir "$(Build.ArtifactStagingDirectory)/win-sign-work" `
                      --signed-input-dir "$(Build.ArtifactStagingDirectory)/win-sign-input" `
                      --output-wheels-dir "$(Build.ArtifactStagingDirectory)/win-wheels-signed"
                  displayName: Repackage windows wheels

                - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
                  parameters:
                    ArtifactPath: '$(Build.ArtifactStagingDirectory)/win-wheels-signed'
                    ArtifactName: 'packages_win_signed'

            - job: Build_Release_Artifact
              displayName: Build release artifact
              dependsOn:
                - Sign_macOS
                - Sign_Windows
              pool:
                name: $(LINUXPOOL)
                image: $(LINUXVMIMAGE)
                os: linux
              steps:
                - checkout: none

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: packages_linux
                    targetPath: $(Build.ArtifactStagingDirectory)/packages_linux

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: packages_extended
                    targetPath: $(Build.ArtifactStagingDirectory)/packages_extended

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: packages_mac_signed
                    targetPath: $(Build.ArtifactStagingDirectory)/packages_mac

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifactName: packages_win_signed
                    targetPath: $(Build.ArtifactStagingDirectory)/packages_windows

                - pwsh: |
                    $releaseArtifactDir = "$(Build.ArtifactStagingDirectory)/release_packages"
                    $linuxPackagesDir = "$(Build.ArtifactStagingDirectory)/packages_linux"
                    $extendedPackagesDir = "$(Build.ArtifactStagingDirectory)/packages_extended"
                    New-Item -ItemType Directory -Path $releaseArtifactDir -Force | Out-Null

                    Get-ChildItem $extendedPackagesDir |
                      Copy-Item -Destination $releaseArtifactDir -Recurse -Force

                    function Copy-ArtifactPreservingRelativePath {
                      param(
                        [string]$artifactPath,
                        [string]$sourceRoot
                      )

                      $sourceDirectory = Split-Path $artifactPath -Parent
                      $relativeDirectory = $sourceDirectory.Substring($sourceRoot.Length).TrimStart('\', '/')
                      $targetDirectory = if ([string]::IsNullOrEmpty($relativeDirectory)) {
                        $releaseArtifactDir
                      } else {
                        Join-Path $releaseArtifactDir $relativeDirectory
                      }

                      New-Item -ItemType Directory -Path $targetDirectory -Force | Out-Null
                      Copy-Item -Path $artifactPath -Destination $targetDirectory -Force
                    }

                    function Copy-SignedWheelToPackageFolder {
                      param([string]$wheelPath)

                      $wheelName = Split-Path $wheelPath -Leaf
                      if ($wheelName -notmatch '^(?<package>.+?)-(?<version>\d[^-]*)-') {
                        throw "Unable to determine the package folder for signed wheel '$wheelName'."
                      }

                      $packageFolder = $matches['package'].Replace('_', '-')
                      $targetFolder = Join-Path $releaseArtifactDir $packageFolder

                      if (-not (Test-Path $targetFolder)) {
                        throw "Expected package folder '$targetFolder' for signed wheel '$wheelName'."
                      }

                      Copy-Item -Path $wheelPath -Destination $targetFolder -Force
                    }

                    Get-ChildItem $linuxPackagesDir -Recurse -Filter "*.whl" |
                      ForEach-Object { Copy-ArtifactPreservingRelativePath $_.FullName $linuxPackagesDir }

                    Get-ChildItem "$(Build.ArtifactStagingDirectory)/packages_mac" -Recurse -Filter "*.whl" |
                      ForEach-Object { Copy-SignedWheelToPackageFolder $_.FullName }

                    Get-ChildItem "$(Build.ArtifactStagingDirectory)/packages_windows" -Recurse -Filter "*.whl" |
                      ForEach-Object { Copy-SignedWheelToPackageFolder $_.FullName }
                  displayName: Assemble release artifact

                - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
                  parameters:
                    ArtifactPath: '$(Build.ArtifactStagingDirectory)/release_packages'
                    ArtifactName: 'packages_all_signed'

          variables:
            - template: /eng/pipelines/templates/variables/globals.yml
            - template: /eng/pipelines/templates/variables/image.yml

      - template: archetype-python-release.yml
        parameters:
          ${{ if eq(parameters.ServiceDirectory, 'storage') }}:
            DependsOn: Sign_Binaries
            ArtifactName: packages_all_signed
          ${{ if ne(parameters.ServiceDirectory, 'storage') }}:
            DependsOn: Build
            ArtifactName: packages_extended
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          Artifacts: ${{ parameters.Artifacts }}
          ${{ if eq(parameters.ServiceDirectory, 'template') }}:
            TestPipeline: true
          DocArtifact: documentation
          TargetDocRepoOwner: ${{ parameters.TargetDocRepoOwner }}
          TargetDocRepoName: ${{ parameters.TargetDocRepoName }}
          DevFeedName: ${{ parameters.DevFeedName }}
          PublicFeed: ${{ parameters.PublicFeed }}
          PublicPublishEnvironment: ${{ parameters.PublicPublishEnvironment }}
