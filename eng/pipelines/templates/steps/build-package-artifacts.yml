parameters:
  - name: BeforePublishSteps
    type: object
    default: []
  - name: TestPipeline
    type: boolean
    default: false
  - name: ServiceDirectory
    type: string
    default: ''
  - name: Artifacts
    type: object
    default: []
  - name: DevFeedName
    type: string
    default: 'public/azure-sdk-for-python'
  - name: ArtifactSuffix
    type: string
    default: 'linux'
  - name: BuildTargetingString
    type: string
    default: '*'
  - name: ExcludePaths
    type: object
    default: []
  # Install the Microsoft internal Rust toolchain before building. Only needed by
  # packages whose extension is compiled by msrustup.
  - name: InstallMsRustToolchain
    type: boolean
    default: false
  # Passed to RustInstaller as the directory holding rust-toolchain.toml.
  - name: MsRustWorkingDirectory
    type: string
    default: ''
  - name: MsRustToolchainFeed
    type: string
    default: ''
  # Extra Rust target triples, installed only on Windows agents where the ARM64
  # wheel is cross-compiled from x64.
  - name: MsRustAdditionalTargets
    type: string
    default: ''

steps:
  - ${{ if endsWith(variables['Build.Repository.Name'], '-pr') }}:
    - checkout: self
  - ${{ else }}:
    - template: /eng/common/pipelines/templates/steps/sparse-checkout.yml
      parameters:
        Paths:
          - '**'

  - task: UsePythonVersion@0
    displayName: 'Use Python $(PythonVersion)'
    condition: and(succeeded(), or(eq(variables['ENABLE_EXTENSION_BUILD'], 'true'), eq('${{ parameters.ArtifactSuffix }}', 'linux')))
    inputs:
      versionSpec: $(PythonVersion)

  # Authenticate to Azure Artifacts feed immediately after checkout to prevent 401 errors
  # Public feeds have upstream sources enabled and require authentication for passthrough to pypi.org
  - template: auth-dev-feed.yml
    parameters:
      DevFeedName: ${{ parameters.DevFeedName }}
      EnableTwineAuth: false

  - template: /eng/pipelines/templates/steps/use-venv.yml

  - template: /eng/common/pipelines/templates/steps/set-test-pipeline-version.yml@self
    parameters:
      PackageName: "azure-template"
      ServiceDirectory: "template"
      TestPipeline: ${{ parameters.TestPipeline }}

  - template: /eng/common/pipelines/templates/steps/set-default-branch.yml@self

  - script: |
      echo "##vso[build.addbuildtag]Scheduled"
    displayName: 'Tag scheduled builds'
    condition: and(eq(variables['Build.SourceBranchName'], variables['DefaultBranch']), eq(variables['Build.Reason'],'Schedule'))

  - pwsh: |
      if ("${{ parameters.ServiceDirectory }}" -ne "auto")
      {
        Write-Host "##vso[task.setvariable variable=ComponentDetection.SourcePath]$(Build.SourcesDirectory)/sdk/${{ parameters.ServiceDirectory }}"
      }
    displayName: Set Component Governance Path

  # Create package properties file before updating the version to daily dev build
  # This is required to set the package version in info file before it's updated.
  - template: /eng/common/pipelines/templates/steps/save-package-properties.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      ExcludePaths: ${{ parameters.ExcludePaths }}

  # set dev build calls SavePackageProperties with dev version if necessary. this will never happen in a PR build
  # however, it will set the variable SetDevVersion as appropriate for normal nightly runs
  - template: set-dev-build.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}

  - template: /eng/common/pipelines/templates/steps/save-package-properties.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      ExcludePaths: ${{ parameters.ExcludePaths }}

  - template: /eng/pipelines/templates/steps/resolve-package-targeting.yml
    parameters:
      BuildTargetingString: ${{ parameters.BuildTargetingString }}
      PackagePropertiesFolder: $(Build.ArtifactStagingDirectory)/PackageInfo

  # todo, walk the artifacts and ensure that one which includes an extension package is present
  # if not, we only need to build on linux. if so, we need to build on all platforms
  - template: /eng/pipelines/templates/steps/resolve-build-platforms.yml
    parameters:
      PackagePropertiesFolder: $(Build.ArtifactStagingDirectory)/PackageInfo

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      which python
      $(PIP_EXE) install -r eng/ci_tools.txt

      if ($env:AGENT_OS -eq "Linux") {
        Write-Host "Installing release reqs"
        $(PIP_EXE) install -r eng/release_requirements.txt
      }
      $(PIP_EXE) freeze
    displayName: 'Prep Environment'
    condition: and(succeeded(), or(eq(variables['ENABLE_EXTENSION_BUILD'], 'true'), eq('${{ parameters.ArtifactSuffix }}', 'linux')))

  - script: |
      sudo apt-get update
      sudo apt-get install -y qemu-user-static binfmt-support
      sudo update-binfmts --enable qemu-aarch64
    displayName: 'Install QEMU Dependencies'
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

  - ${{ if parameters.InstallMsRustToolchain }}:
    - template: /eng/pipelines/templates/steps/install-msrust-toolchain.yml
      parameters:
        # Only forwarded when a caller overrides it, so the default feed defined by
        # the template stays the single source of truth.
        ${{ if ne(parameters.MsRustToolchainFeed, '') }}:
          ToolchainFeed: ${{ parameters.MsRustToolchainFeed }}
        WorkingDirectory: ${{ parameters.MsRustWorkingDirectory }}
        ${{ if eq(parameters.ArtifactSuffix, 'windows') }}:
          AdditionalTargets: ${{ parameters.MsRustAdditionalTargets }}
        Condition: and(succeeded(), or(eq(variables['ENABLE_EXTENSION_BUILD'], 'true'), eq('${{ parameters.ArtifactSuffix }}', 'linux')))

  # Windows: cibuildwheel fetches CPython from api.nuget.org, which is blocked.
  # Pre-provision the interpreters from the Azure DevOps NuGet feed into the
  # cibuildwheel cache so it skips the blocked download.
  - task: NuGetAuthenticate@1
    displayName: 'Authenticate to NuGet feed'
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['ENABLE_EXTENSION_BUILD'], 'true'))

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $feed = "https://pkgs.dev.azure.com/azure-sdk/public/_packaging/azure-sdk-for-net/nuget/v3/index.json"
      $version = "3.10.11"
      $cache = Join-Path "$(Agent.TempDirectory)" "cibw-cache"
      $nugetCpython = Join-Path $cache "nuget-cpython"
      New-Item -ItemType Directory -Force -Path $nugetCpython | Out-Null
      $nuget = (Get-Command nuget).Source
      & $nuget install python -Version $version -Source $feed -OutputDirectory $nugetCpython
      if ($LASTEXITCODE) { 
        Write-Error "Failed to download python $version"
        exit 1
      }
      & $nuget install pythonarm64 -Version $version -Source $feed -OutputDirectory $nugetCpython
      if ($LASTEXITCODE) { 
        Write-Error "Failed to download pythonarm64 $version"
        exit 1
      }
      Write-Host "##vso[task.setvariable variable=CIBW_CACHE_PATH]$cache"

      # Cross-compiled ARM64 wheels need a directory of ARM64 import libraries.
      # Packages that build Rust extensions point PYO3_CROSS_LIB_DIR at this,
      # which is what tells maturin it is cross-compiling; see the win_arm64
      # override in the package's pyproject.toml.
      $arm64Libs = Join-Path $nugetCpython "pythonarm64.$version\tools\libs"
      if (-not (Test-Path $arm64Libs)) {
        Write-Error "Expected ARM64 import libraries at $arm64Libs"
        exit 1
      }
      Write-Host "##vso[task.setvariable variable=PYTHON_ARM64_LIB_DIR]$arm64Libs"
    displayName: 'Pre-provision CPython for cibuildwheel'
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Windows_NT'), eq(variables['ENABLE_EXTENSION_BUILD'], 'true'))

  # Linux: forward PIP_INDEX_URL into the build container so pip fetches build
  # dependencies from the Azure DevOps feed instead of PyPI. Using
  # CIBW_ENVIRONMENT_PASS_LINUX (not CIBW_ENVIRONMENT) preserves the package's
  # own [tool.cibuildwheel].environment (CFLAGS) setting.
  #
  # This variable REPLACES the package's own environment-pass list rather than
  # merging with it, so it has to name every variable any package needs. The
  # MSRUSTUP_* entries let packages that compile Rust bootstrap the internal
  # toolchain inside the container. cibuildwheel silently skips names that are
  # not set on the host, so listing them is a no-op elsewhere.
  - pwsh: |
      Write-Host "##vso[task.setvariable variable=CIBW_ENVIRONMENT_PASS_LINUX]PIP_INDEX_URL MSRUSTUP_ACCESS_TOKEN MSRUSTUP_PAT MSRUSTUP_FEED_URL CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_INDEX CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_TOKEN CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_CREDENTIAL_PROVIDER"
    displayName: 'Forward PIP_INDEX_URL to cibuildwheel'
    condition: and(succeeded(), or(eq(variables['ENABLE_EXTENSION_BUILD'], 'true'), eq('${{ parameters.ArtifactSuffix }}', 'linux')))

  - pwsh: |
      which python
      sdk_build -d "$(Build.ArtifactStagingDirectory)" "$(TargetingString)" --inactive --service="${{ parameters.ServiceDirectory }}"
    displayName: 'Generate Packages'
    condition: and(succeeded(), or(eq(variables['ENABLE_EXTENSION_BUILD'], 'true'), eq('${{ parameters.ArtifactSuffix }}', 'linux')))
    # Packages that compile a Rust extension build one wheel per architecture,
    # and the Linux aarch64 wheel is compiled inside an emulated container,
    # which takes roughly an hour on its own. The default is left alone for
    # everything else.
    ${{ if parameters.InstallMsRustToolchain }}:
      timeoutInMinutes: 210
    ${{ else }}:
      timeoutInMinutes: 80
    env:
      CIBW_BUILD_VERBOSITY: 3
      # Set to DEBUG for extension builds so sdk_build streams cibuildwheel output
      # live instead of buffering it until the command finishes. See the step that
      # defines this variable in resolve-build-platforms.yml.
      LOGLEVEL: $(SDK_BUILD_LOGLEVEL)
      ${{ if parameters.InstallMsRustToolchain }}:
        # Linux wheels are compiled inside a manylinux container that cibuildwheel
        # starts, so the toolchain installed on the agent above is not visible to the
        # compiler. The container installs msrustup itself and needs a credential for
        # the toolchain feed, forwarded by the package's cibuildwheel environment-pass
        # list. System.AccessToken is secret, so it is not exported to the environment
        # unless it is mapped here explicitly.
        MSRUSTUP_ACCESS_TOKEN: $(System.AccessToken)
        MSRUSTUP_FEED_URL: $(MSRUSTUP_FEED_URL)
        # Cargo credentials for the crates.io replacement feed. CargoAuthenticate
        # sets these, but the token is secret and so is not placed in the
        # environment unless it is mapped here. The container needs them because
        # index.crates.io is not reachable from a build agent.
        CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_TOKEN: $(CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_TOKEN)
        CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_CREDENTIAL_PROVIDER: $(CARGO_REGISTRIES_AZURE_SDK_FOR_RUST_PUBLIC_CREDENTIAL_PROVIDER)

  - pwsh: |
      which python
      twine check $(Build.ArtifactStagingDirectory)/**/*.whl
      twine check $(Build.ArtifactStagingDirectory)/**/*.tar.gz
    displayName: 'Verify Readme'
    condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Linux'))

  - ${{ parameters.BeforePublishSteps }}

  # we need to publish an empty artifact. when publishing an empty artifact, let's ensure that there isn't anything to
  # cause CG or SBOM generation to have to do actual work.
  - pwsh: |
      Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse `
        | Where-Object { !($_.Name.EndsWith("CredScanSuppression.json")) -and ($_.PSIsContainer -ne $true) } `
        | Remove-Item -Force -Recurse
    displayName: Clean up repo
    condition: and(succeeded(), ne(variables['ENABLE_EXTENSION_BUILD'], 'true'), ne('${{ parameters.ArtifactSuffix }}', 'linux'))

  # we need to only publish this if running on linux. we only need one for all stages
  - pwsh: |
      New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)/release_artifact"
      Copy-Item -Path "$(Build.SourcesDirectory)/eng/release_requirements.txt" -Destination "$(Build.ArtifactStagingDirectory)/release_artifact/release_requirements.txt"
    displayName: 'Assemble Static Files for Release Stage'
    condition: and(succeeded(), eq(variables['Agent.OS'], 'Linux'))

  - ${{ if eq(parameters.ArtifactSuffix, 'linux') }}:
    - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
      parameters:
        ArtifactPath: '$(Build.ArtifactStagingDirectory)/release_artifact'
        ArtifactName: 'release_artifact'

  - ${{ if eq(parameters.ArtifactSuffix, '') }}:
    - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
      parameters:
        ArtifactPath: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'packages'

  - ${{ if ne(parameters.ArtifactSuffix, '') }}:
    - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
      parameters:
        ArtifactPath: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'packages_${{ parameters.ArtifactSuffix }}'
