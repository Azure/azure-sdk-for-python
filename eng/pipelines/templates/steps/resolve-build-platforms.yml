parameters:
  - name: PackagePropertiesFolder
    type: string
    default: ''
  - name: InstallMsRustToolchain
    type: boolean
    default: false
  - name: AutoResolveMsRust
    type: boolean
    default: false

steps:
    # Packages that ship compiled binaries opt in with `signBinaries: true` on their artifact entry in
    # the service ci.yml. Save-Package-Properties copies that artifact entry verbatim into each package
    # info file as `ArtifactDetails`, so the opt-in is readable here without threading the artifact list
    # through every caller.
    #
    # resolve-package-targeting.yml runs immediately before this and deletes the package info files that
    # this run is not targeting, so the folder is already narrowed to the packages being built; on 'auto'
    # pull request builds save-package-properties.yml narrows it to the PR diff first. This deliberately
    # keeps reading the folder rather than the $(TargetingString) those steps also set, because that
    # variable carries only package names and the decision below needs an artifact property.
    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $binaryPackages = @()
        $rustPackages = @()
        $rustConfiguration = $null
        $logLevel = "INFO"

        foreach ($packageInfoPath in (Get-ChildItem -Recurse -Force "${{ parameters.PackagePropertiesFolder }}/*.json")) {
          $packageInfo = Get-Content -Raw -Path $packageInfoPath.FullName | ConvertFrom-Json

          if ($packageInfo.ArtifactDetails.signBinaries -eq $true) {
            $binaryPackages += $packageInfo.Name

            # Rust packages pin their compiler with rust-toolchain.toml; only these need the Rust toolchain setup.
            $packageDirectory = "$($packageInfo.DirectoryPath)"
            if ($packageDirectory -and -not [System.IO.Path]::IsPathRooted($packageDirectory)) {
              $packageDirectory = Join-Path "$env:BUILD_SOURCESDIRECTORY" $packageDirectory
            }
            if ($packageDirectory -and (Test-Path (Join-Path $packageDirectory 'rust-toolchain.toml') -PathType Leaf)) {
              if ($env:INSTALL_MS_RUST_TOOLCHAIN -eq 'true') {
                $rustPackages += $packageInfo.Name
              }
              elseif ($env:AUTO_RESOLVE_MS_RUST -eq 'true' -and $packageInfo.CIParameters.InstallMsRustToolchain -eq $true) {
                $configuration = [ordered]@{
                  WorkingDirectory = ([string]$packageInfo.CIParameters.MsRustWorkingDirectory).Replace(('$' + '(Build.SourcesDirectory)'), $env:BUILD_SOURCESDIRECTORY)
                  ToolchainFeed = [string]$packageInfo.CIParameters.MsRustToolchainFeed
                  AdditionalTargets = [string]$packageInfo.CIParameters.MsRustAdditionalTargets
                }
                if ($rustConfiguration -and (($rustConfiguration | ConvertTo-Json -Compress) -ne ($configuration | ConvertTo-Json -Compress))) {
                  throw 'Targeted Rust packages require different toolchain configurations; build their services separately.'
                }
                $rustConfiguration = $configuration
                $rustPackages += $packageInfo.Name
              }
            }
          }
        }

        if ($binaryPackages) {
          Write-Host "Targeting package(s) with compiled binaries ($($binaryPackages -join ', ')), enabling extension build."
          Write-Host "##vso[task.setvariable variable=ENABLE_EXTENSION_BUILD]true"
          # DEBUG streams long native builds instead of buffering output until a failure.
          $logLevel = "DEBUG"
        }
        else {
          Write-Host "No targeted package declares compiled binaries, building on linux only."
        }
        if ($rustPackages) {
          Write-Host "Targeting Rust package(s) ($($rustPackages -join ', ')), enabling Rust toolchain setup."
        }
        $rustEnabled = ($rustPackages.Count -gt 0).ToString().ToLowerInvariant()
        Write-Host "##vso[task.setvariable variable=ENABLE_RUST_BUILD]$rustEnabled"
        Write-Host "##vso[task.setvariable variable=RESOLVED_MS_RUST_DIRECTORY]$($rustConfiguration.WorkingDirectory)"
        Write-Host "##vso[task.setvariable variable=RESOLVED_MS_RUST_FEED]$($rustConfiguration.ToolchainFeed)"
        Write-Host "##vso[task.setvariable variable=RESOLVED_MS_RUST_TARGETS]$($rustConfiguration.AdditionalTargets)"
        # Always define the variable used by the build step's LOGLEVEL mapping.
        Write-Host "##vso[task.setvariable variable=SDK_BUILD_LOGLEVEL]$logLevel"
      displayName: Check extension package presence
      env:
        INSTALL_MS_RUST_TOOLCHAIN: ${{ parameters.InstallMsRustToolchain }}
        AUTO_RESOLVE_MS_RUST: ${{ parameters.AutoResolveMsRust }}
